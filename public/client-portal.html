<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal — SEO Progress Dashboard</title>
    <meta name="description" content="Track your SEO campaign progress, keyword rankings, and wins in real-time.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a0a0f; color: #e5e5e5; }
        
        .glass-card {
            background: rgba(17, 17, 27, 0.8);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border-radius: 16px;
        }
        
        .metric-card {
            background: linear-gradient(135deg, rgba(17,17,27,0.9) 0%, rgba(25,25,40,0.7) 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .metric-card:hover {
            transform: translateY(-2px);
            border-color: rgba(139,92,246,0.3);
        }
        
        .score-ring {
            width: 140px; height: 140px;
            border-radius: 50%;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .score-ring svg { position: absolute; transform: rotate(-90deg); }
        .score-ring circle {
            fill: none; stroke-width: 8; stroke-linecap: round;
        }
        
        .progress-bar {
            height: 6px; border-radius: 3px; overflow: hidden;
            background: rgba(255,255,255,0.06);
        }
        .progress-bar-fill {
            height: 100%; border-radius: 3px;
            transition: width 1s ease;
        }
        
        .rank-up { color: #34d399; }
        .rank-down { color: #f87171; }
        .rank-same { color: #9ca3af; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        .fade-in-delay-1 { animation-delay: 0.1s; opacity: 0; }
        .fade-in-delay-2 { animation-delay: 0.2s; opacity: 0; }
        .fade-in-delay-3 { animation-delay: 0.3s; opacity: 0; }
        .fade-in-delay-4 { animation-delay: 0.4s; opacity: 0; }
        
        .gradient-text {
            background: linear-gradient(135deg, #a78bfa 0%, #818cf8 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="border-b border-white/5 px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-gradient-to-br from-violet-500 to-indigo-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="bar-chart-3" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg font-semibold text-white" id="portalTitle">SEO Progress Dashboard</h1>
                    <p class="text-xs text-gray-500" id="portalSubtitle">Loading...</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs text-gray-500" id="lastUpdated"></span>
                <button onclick="location.href='/dashboard'" class="text-xs text-gray-400 hover:text-white transition-colors flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-3 h-3"></i> Back
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-8" id="portalContent">
        <!-- Loading State -->
        <div id="loadingState" class="flex flex-col items-center justify-center py-24">
            <div class="w-12 h-12 border-2 border-violet-500/30 border-t-violet-500 rounded-full animate-spin mb-4"></div>
            <p class="text-gray-400 text-sm">Loading your dashboard...</p>
        </div>
    </main>

    <script>
    // =========================================================================
    // CLIENT PORTAL — INIT
    // =========================================================================
    let portalData = null;

    async function initPortal() {
        try {
            // Get user info to find campaign
            const meResp = await fetch('/api/auth/me');
            if (!meResp.ok) { location.href = '/'; return; }
            const me = await meResp.json();
            
            // Get campaigns
            const campResp = await fetch('/api/campaigns');
            const campData = await campResp.json();
            const campaigns = campData.campaigns || campData || [];
            
            if (!campaigns.length) {
                document.getElementById('loadingState').innerHTML = `
                    <div class="text-center">
                        <i data-lucide="inbox" class="w-12 h-12 text-gray-600 mx-auto mb-4"></i>
                        <h3 class="text-lg font-semibold text-white mb-2">No Campaigns Found</h3>
                        <p class="text-gray-400">Your SEO campaign hasn't been set up yet. Contact your agency to get started.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }
            
            // Use first campaign (or assigned campaign for viewers)
            const campaign = campaigns[0];
            const campaignId = campaign.id;
            
            // Fetch portal summary
            const sumResp = await fetch(`/api/client-portal/summary?campaign_id=${campaignId}`);
            const sumData = await sumResp.json();
            
            if (!sumData.success) throw new Error(sumData.error || 'Failed to load');
            
            portalData = sumData;
            renderPortal(sumData, campaignId);
            
        } catch (err) {
            console.error('Portal init error:', err);
            document.getElementById('loadingState').innerHTML = `
                <div class="text-center">
                    <i data-lucide="alert-triangle" class="w-12 h-12 text-red-400 mx-auto mb-4"></i>
                    <h3 class="text-lg font-semibold text-white mb-2">Something went wrong</h3>
                    <p class="text-gray-400">${err.message}</p>
                    <button onclick="initPortal()" class="mt-4 px-4 py-2 bg-violet-600 text-white rounded-lg text-sm hover:bg-violet-700 transition-colors">Retry</button>
                </div>`;
            lucide.createIcons();
        }
    }

    function renderPortal(data, campaignId) {
        const fmt = (n) => (n || 0).toLocaleString();
        const m = data.metrics || {};
        const sc = data.scorecard || {};
        const tasks = data.tasks || {};
        const kws = data.keywords || [];
        const placements = data.placements || [];
        const camp = data.campaign || {};
        
        // Update header
        document.getElementById('portalTitle').textContent = camp.name || 'SEO Dashboard';
        document.getElementById('portalSubtitle').textContent = camp.domain || '';
        document.getElementById('lastUpdated').textContent = `Updated: ${new Date().toLocaleDateString()}`;
        
        // Score
        const score = sc.competitive_score || sc.brand_authority || 0;
        const scoreColor = score >= 70 ? '#34d399' : score >= 40 ? '#fbbf24' : '#f87171';
        const circumference = 2 * Math.PI * 58;
        const strokeDashoffset = circumference - (score / 100) * circumference;
        
        // Task completion %
        const taskPct = tasks.total > 0 ? Math.round((tasks.completed / tasks.total) * 100) : 0;
        
        const content = document.getElementById('portalContent');
        content.innerHTML = `
        <div class="space-y-8">
            <!-- Row 1: Score + Metrics -->
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 fade-in">
                <!-- SEO Health Score -->
                <div class="glass-card p-6 flex flex-col items-center justify-center lg:row-span-1">
                    <p class="text-xs uppercase tracking-wider text-gray-500 mb-4">SEO Health Score</p>
                    <div class="score-ring mb-3">
                        <svg width="140" height="140" viewBox="0 0 140 140">
                            <circle cx="70" cy="70" r="58" stroke="rgba(255,255,255,0.06)" />
                            <circle cx="70" cy="70" r="58" stroke="${scoreColor}" 
                                    stroke-dasharray="${circumference}" 
                                    stroke-dashoffset="${strokeDashoffset}"
                                    style="transition: stroke-dashoffset 1.5s ease;" />
                        </svg>
                        <div class="text-center z-10">
                            <span class="text-4xl font-bold text-white">${score}</span>
                            <span class="text-gray-400 text-sm block">/100</span>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500">${score >= 70 ? 'Strong Performance' : score >= 40 ? 'Needs Improvement' : 'Requires Attention'}</p>
                </div>
                
                <!-- Metric Cards -->
                <div class="metric-card fade-in fade-in-delay-1">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs uppercase tracking-wider text-gray-500">Organic Traffic</span>
                        <i data-lucide="trending-up" class="w-4 h-4 text-emerald-400"></i>
                    </div>
                    <p class="text-3xl font-bold text-white mb-1">${fmt(m.total_traffic)}</p>
                    <p class="text-xs text-gray-500">Monthly visits</p>
                </div>
                
                <div class="metric-card fade-in fade-in-delay-2">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs uppercase tracking-wider text-gray-500">Ranking Keywords</span>
                        <i data-lucide="search" class="w-4 h-4 text-blue-400"></i>
                    </div>
                    <p class="text-3xl font-bold text-white mb-1">${fmt(m.total_keywords)}</p>
                    <p class="text-xs text-gray-500">In Google Top 100</p>
                </div>
                
                <div class="metric-card fade-in fade-in-delay-3">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs uppercase tracking-wider text-gray-500">Domain Authority</span>
                        <i data-lucide="award" class="w-4 h-4 text-violet-400"></i>
                    </div>
                    <p class="text-3xl font-bold gradient-text mb-1">${m.domain_rank || '—'}</p>
                    <p class="text-xs text-gray-500">${fmt(m.referring_domains)} referring domains</p>
                </div>
            </div>
            
            <!-- Row 2: Keywords + Tasks -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Keyword Rankings -->
                <div class="glass-card overflow-hidden lg:col-span-2 fade-in fade-in-delay-2">
                    <div class="p-5 border-b border-white/5 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i data-lucide="target" class="w-4 h-4 text-violet-400"></i>
                            <h3 class="font-semibold text-white">Keyword Rankings</h3>
                        </div>
                        <span class="text-xs text-gray-500">${kws.length} tracked</span>
                    </div>
                    ${kws.length > 0 ? `
                    <div class="overflow-y-auto max-h-80">
                        <table class="w-full text-sm">
                            <thead class="bg-white/[0.02] sticky top-0">
                                <tr>
                                    <th class="text-left px-5 py-3 text-xs font-medium text-gray-500 uppercase tracking-wider">Keyword</th>
                                    <th class="text-center px-3 py-3 text-xs font-medium text-gray-500 uppercase tracking-wider">Rank</th>
                                    <th class="text-center px-3 py-3 text-xs font-medium text-gray-500 uppercase tracking-wider">Change</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/[0.03]">
                                ${kws.map(kw => {
                                    const changeClass = kw.change > 0 ? 'rank-up' : kw.change < 0 ? 'rank-down' : 'rank-same';
                                    const changeIcon = kw.change > 0 ? 'arrow-up' : kw.change < 0 ? 'arrow-down' : 'minus';
                                    const changeText = kw.change ? `${kw.change > 0 ? '+' : ''}${kw.change}` : '—';
                                    return `
                                    <tr class="hover:bg-white/[0.02] transition-colors">
                                        <td class="px-5 py-3 text-white font-medium">${kw.keyword}</td>
                                        <td class="px-3 py-3 text-center">
                                            ${kw.rank ? `<span class="font-mono text-sm ${kw.rank <= 3 ? 'text-emerald-400 font-bold' : kw.rank <= 10 ? 'text-blue-400' : 'text-gray-400'}">#${kw.rank}</span>` : '<span class="text-gray-600">—</span>'}
                                        </td>
                                        <td class="px-3 py-3 text-center">
                                            <span class="${changeClass} flex items-center justify-center gap-1 text-xs font-medium">
                                                <i data-lucide="${changeIcon}" class="w-3 h-3"></i>${changeText}
                                            </span>
                                        </td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                    ` : `
                    <div class="p-8 text-center text-gray-500">
                        <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                        <p class="text-sm">No tracked keywords yet. Your agency will set these up shortly.</p>
                    </div>
                    `}
                </div>
                
                <!-- Task Progress -->
                <div class="glass-card p-5 fade-in fade-in-delay-3">
                    <div class="flex items-center gap-2 mb-5">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
                        <h3 class="font-semibold text-white">Task Progress</h3>
                    </div>
                    
                    <!-- Progress Ring -->
                    <div class="flex justify-center mb-5">
                        <div class="relative w-24 h-24">
                            <svg class="w-24 h-24 -rotate-90" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8" />
                                <circle cx="50" cy="50" r="40" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round"
                                        stroke-dasharray="${2 * Math.PI * 40}" 
                                        stroke-dashoffset="${2 * Math.PI * 40 * (1 - taskPct / 100)}"
                                        style="transition: stroke-dashoffset 1s ease;" />
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <span class="text-lg font-bold text-white">${taskPct}%</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 text-center mb-5">
                        <div class="bg-white/[0.03] rounded-lg p-3">
                            <p class="text-xl font-bold text-emerald-400">${tasks.completed}</p>
                            <p class="text-[10px] uppercase text-gray-500">Completed</p>
                        </div>
                        <div class="bg-white/[0.03] rounded-lg p-3">
                            <p class="text-xl font-bold text-amber-400">${tasks.upcoming}</p>
                            <p class="text-[10px] uppercase text-gray-500">In Progress</p>
                        </div>
                    </div>
                    
                    ${tasks.recent_completed && tasks.recent_completed.length > 0 ? `
                    <div>
                        <p class="text-[10px] uppercase text-gray-500 tracking-wider mb-2">Recently Completed</p>
                        <div class="space-y-1.5">
                            ${tasks.recent_completed.map(t => `
                                <div class="flex items-center gap-2 text-xs">
                                    <i data-lucide="check" class="w-3 h-3 text-emerald-400 flex-shrink-0"></i>
                                    <span class="text-gray-300 truncate">${t.title}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
            </div>
            
            <!-- Row 3: Placements / Wins -->
            ${placements.length > 0 ? `
            <div class="glass-card overflow-hidden fade-in fade-in-delay-4">
                <div class="p-5 border-b border-white/5 flex items-center gap-2">
                    <i data-lucide="trophy" class="w-4 h-4 text-amber-400"></i>
                    <h3 class="font-semibold text-white">Recent Wins — Link Placements</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-white/[0.02]">
                            <tr>
                                <th class="text-left px-5 py-3 text-xs font-medium text-gray-500 uppercase">Target URL</th>
                                <th class="text-left px-3 py-3 text-xs font-medium text-gray-500 uppercase">Anchor Text</th>
                                <th class="text-center px-3 py-3 text-xs font-medium text-gray-500 uppercase">DR</th>
                                <th class="text-right px-5 py-3 text-xs font-medium text-gray-500 uppercase">Date</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-white/[0.03]">
                            ${placements.map(p => `
                            <tr class="hover:bg-white/[0.02] transition-colors">
                                <td class="px-5 py-3">
                                    <a href="${p.url}" target="_blank" class="text-blue-400 hover:text-blue-300 truncate max-w-xs block text-xs">${p.url}</a>
                                </td>
                                <td class="px-3 py-3 text-white text-xs">${p.anchor || '—'}</td>
                                <td class="px-3 py-3 text-center">
                                    <span class="px-2 py-0.5 rounded text-xs font-bold ${p.dr >= 50 ? 'bg-emerald-900/30 text-emerald-400' : 'bg-gray-800 text-gray-400'}">${p.dr || '—'}</span>
                                </td>
                                <td class="px-5 py-3 text-right text-gray-500 text-xs">${p.date ? new Date(p.date).toLocaleDateString() : '—'}</td>
                            </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            ` : ''}
            
            <!-- Footer -->
            <div class="text-center py-8 text-xs text-gray-600">
                <p>Powered by AgencyOS · This dashboard updates automatically as your campaign progresses.</p>
            </div>
        </div>
        `;
        
        lucide.createIcons();
    }

    // Init on load
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        initPortal();
    });
    </script>
</body>
</html>

                <div class="space-y-6">
                    <div class="flex items-center justify-between"><div><h2 class="text-xl font-bold text-white">AI Link Recommendations</h2><p class="text-sm text-gray-400">${data.total_available} links evaluated · ${data.existing_placements} existing placements excluded</p></div><p class="text-sm text-gray-400">Est. cost: <span class="text-white font-bold">$${(data.estimated_cost||0).toFixed(0)}</span></p></div>
                    ${recs.length ? `<div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-800/50"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-400">Domain</th><th class="px-4 py-3 text-center text-xs font-medium text-gray-400">Score</th><th class="px-4 py-3 text-center text-xs font-medium text-gray-400">DA</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-400">Niche</th><th class="px-4 py-3 text-right text-xs font-medium text-gray-400">Price</th></tr></thead><tbody class="divide-y divide-gray-800">${recs.map((r,i) => `<tr class="hover:bg-gray-800/30"><td class="px-4 py-3 text-white font-medium">${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${r.domain}</td><td class="px-4 py-3 text-center"><span class="px-2 py-0.5 rounded text-xs font-bold ${r.recommendation_score>=60?'bg-emerald-900/30 text-emerald-400':r.recommendation_score>=40?'bg-blue-900/30 text-blue-400':'bg-gray-800 text-gray-400'}">${r.recommendation_score}</span></td><td class="px-4 py-3 text-center font-bold ${r.da>=50?'text-emerald-400':'text-blue-400'}">${r.da}</td><td class="px-4 py-3 text-gray-400">${r.niche}</td><td class="px-4 py-3 text-right text-white">$${r.price}</td></tr>`).join('')}</tbody></table></div>` : '<div class="text-gray-500 text-center py-8">No recommendations available.</div>'}
                    ${anchors.length ? `<div class="bg-gray-900 border border-gray-800 rounded-xl p-5"><h3 class="text-sm font-semibold text-white mb-3">Recommended Anchor Text Distribution</h3><div class="grid grid-cols-2 md:grid-cols-5 gap-3">${anchors.map(a => `<div class="bg-gray-800 rounded-lg p-3"><p class="text-xs text-gray-500 uppercase">${a.type}</p><p class="text-sm text-white font-medium mt-1">${a.text}</p><p class="text-xs text-violet-400 mt-1">${a.recommended_pct}</p></div>`).join('')}</div></div>` : ''}
                </div>`;
                lucide.createIcons();
            } catch(e) { ca.innerHTML = `<div class="text-red-400 text-center p-8">${e.message}</div>`; }
        }

        // =================================================================
        // PHASE 4: EMBEDDED SOP LIBRARY
        // =================================================================
        async function renderSOPLibrary() {
            const ca = document.getElementById('contentArea');
            ca.innerHTML = '<div class="flex items-center justify-center p-12"><i data-lucide="loader-2" class="w-6 h-6 animate-spin text-violet-500 mr-2"></i><span class="text-gray-400">Loading SOPs...</span></div>';
            lucide.createIcons();
            try {
                const resp = await fetch('/api/sops');
                const data = await resp.json();
                const sops = data.sops || [];
                const typeColors = {
                    technical: 'border-red-500/30 bg-red-900/10',
                    content: 'border-blue-500/30 bg-blue-900/10',
                    link_building: 'border-emerald-500/30 bg-emerald-900/10',
                    optimization: 'border-amber-500/30 bg-amber-900/10',
                    reporting: 'border-violet-500/30 bg-violet-900/10',
                    strategy: 'border-cyan-500/30 bg-cyan-900/10'
                };
                const typeIcons = {
                    technical: 'wrench', content: 'file-text', link_building: 'link',
                    optimization: 'search', reporting: 'bar-chart-3', strategy: 'compass'
                };
                ca.innerHTML = `
                <div class="space-y-6">
                    <div><h2 class="text-xl font-bold text-white">Standard Operating Procedures</h2>
                    <p class="text-sm text-gray-400">${sops.length} SOPs covering all operational roles</p></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${sops.map(sop => `
                        <div class="bg-gray-900 border ${typeColors[sop.type] || 'border-gray-800'} rounded-xl overflow-hidden">
                            <div class="p-4 border-b border-gray-800 flex items-center justify-between cursor-pointer" onclick="this.parentElement.querySelector('.sop-body').classList.toggle('hidden')">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-lg ${typeColors[sop.type] || 'bg-gray-800'} flex items-center justify-center">
                                        <i data-lucide="${typeIcons[sop.type] || 'book-open'}" class="w-4 h-4 text-white"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-semibold text-white text-sm">${sop.title}</h3>
                                        <p class="text-xs text-gray-500">${sop.role}</p>
                                    </div>
                                </div>
                                <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500"></i>
                            </div>
                            <div class="sop-body hidden">
                                <div class="p-4 space-y-3">
                                    <p class="text-xs uppercase font-semibold text-gray-500 tracking-wider">Steps</p>
                                    <ol class="space-y-2">
                                        ${sop.steps.map((s, i) => `<li class="flex gap-3 text-sm"><span class="flex-shrink-0 w-6 h-6 rounded-full bg-gray-800 text-gray-400 flex items-center justify-center text-xs font-bold">${i+1}</span><span class="text-gray-300 pt-0.5">${s}</span></li>`).join('')}
                                    </ol>
                                </div>
                                <div class="p-4 border-t border-gray-800">
                                    <p class="text-xs uppercase font-semibold text-emerald-500 tracking-wider mb-2">Quality Checks</p>
                                    <ul class="space-y-1.5">
                                        ${sop.quality_checks.map(q => `<li class="flex items-start gap-2 text-sm text-gray-400"><i data-lucide="check-circle" class="w-4 h-4 text-emerald-500 flex-shrink-0 mt-0.5"></i>${q}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>`).join('')}
                    </div>
                </div>`;
                lucide.createIcons();
            } catch(e) { ca.innerHTML = `<div class="text-red-400 text-center p-8">${e.message}</div>`; }
        }
    </script>

    <!-- Content Loading Overlay -->
    <div id="contentLoadingOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-[70]">
        <div class="bg-gray-900 border border-gray-700 rounded-xl p-8 text-center">
            <i data-lucide="loader-2" class="w-10 h-10 text-violet-500 animate-spin mx-auto mb-4"></i>
            <span class="text-white text-sm">Processing...</span>
        </div>
    </div>
</body>

</html>

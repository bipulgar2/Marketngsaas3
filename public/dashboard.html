<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgencyOS | SEO Agency Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            900: '#111827',
                            950: '#0B0F19',
                        },
                        violet: {
                            500: '#8B5CF6',
                            600: '#7C3AED',
                        },
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

        html {
            font-size: 13px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0B0F19;
        }

        .top-tab {
            padding: 0.5rem 1rem;
            border-bottom: 2px solid transparent;
        }

        .top-tab.active {
            border-bottom-color: #8B5CF6;
            color: white;
        }

        .top-tab:hover {
            color: white;
        }

        .side-tab {
            padding: 0.5rem 0.75rem;
            border-left: 2px solid transparent;
        }

        .side-tab.active {
            border-left-color: #8B5CF6;
            background: rgba(139, 92, 246, 0.1);
            color: white;
        }

        .side-tab:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0B0F19;
        }

        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.15s ease-out forwards;
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- Top Header Bar -->
    <header class="bg-gray-900 border-b border-gray-800 shrink-0 relative z-50">
        <div class="flex items-center justify-between px-4 h-12">
            <!-- Logo -->
            <div class="flex items-center gap-2">
                <div class="bg-gradient-to-r from-violet-600 to-indigo-600 p-1.5 rounded-lg">
                    <i data-lucide="brain-circuit" class="w-4 h-4 text-white"></i>
                </div>
                <span class="text-sm font-bold text-white">Agency<span class="text-violet-500">OS</span></span>
            </div>

            <!-- Top Tabs -->
            <nav class="flex items-center gap-1" id="topTabs">
                <!-- Populated by JS -->
            </nav>

            <!-- Right Side: Client Selector + New Client -->
            <div class="flex items-center gap-3">
                <select id="clientSelector" onchange="selectClient(this.value)"
                    class="bg-gray-800 border border-gray-700 text-white text-sm rounded-lg px-3 py-1.5 focus:border-violet-500 focus:outline-none min-w-[200px] pointer-events-none appearance-none">
                    <option value="">Select Client...</option>
                </select>
                <button onclick="showNewClientModal()"
                    class="bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    New Client
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Left Sidebar (Side Tabs) -->
        <aside class="w-48 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
            <div class="p-3 border-b border-gray-800">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider" id="sidebarTitle">Navigation</p>
            </div>
            <nav class="flex-1 p-2 space-y-1 overflow-y-auto" id="sideTabs">
                <!-- Populated by JS -->
            </nav>

            <!-- User Info -->
            <div class="p-3 border-t border-gray-800">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-7 h-7 rounded-full bg-gradient-to-r from-violet-600 to-indigo-600 flex items-center justify-center text-white text-xs font-bold"
                        id="userAvatar">?</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-white truncate" id="userName">Loading...</p>
                        <p class="text-xs text-gray-400 truncate" id="userRole">--</p>
                    </div>
                </div>
                <div class="px-2 pb-3 pt-1 space-y-1">
                    <button onclick="showUserSettingsModal()"
                        class="w-full flex items-center justify-center gap-1.5 px-2 py-1.5 text-xs text-gray-400 hover:text-white hover:bg-gray-800 rounded transition-colors">
                        <i data-lucide="settings" class="w-3 h-3"></i> Settings
                    </button>
                    <button onclick="logout()"
                        class="w-full flex items-center justify-center gap-1.5 px-2 py-1.5 text-xs text-gray-400 hover:text-red-400 hover:bg-gray-800 rounded transition-colors">
                        <i data-lucide="log-out" class="w-3 h-3"></i> Logout
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Content Header -->
            <div class="h-12 bg-gray-900/50 border-b border-gray-800 flex items-center justify-between px-6 shrink-0">
                <h1 class="text-base font-semibold text-white" id="pageTitle">Dashboard</h1>
                <div class="flex items-center gap-2" id="pageActions">
                    <!-- Actions populated by JS -->
                </div>
            </div>

            <!-- Content -->
            <div class="flex-1 overflow-y-auto p-6" id="contentArea">
                <div class="flex items-center justify-center h-full text-gray-500">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin mr-2"></i> Loading...
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50">
        <div id="modalContent"
            class="bg-gray-900 border border-gray-700 rounded-xl w-full max-w-lg shadow-2xl animate-fade-in">
        </div>
    </div>

        /** Render <option> tags for a country dropdown. selectedCode = current value to pre-select */

            const seen = new Set();
            return ALL_COUNTRIES.map(c => {
                if (seen.has(c.code)) return '';
                seen.add(c.code);
                const sel = (c.code === selectedCode) ? 'selected' : '';
                return `<option value="${c.code}" ${sel}>${c.name}</option>`;
            }).join('');

        // =========================================================================
        // INIT
        // =========================================================================
        async function init() {
            try {
                const response = await fetch('/api/auth/me');
                if (!response.ok) {
                    window.location.href = '/login.html';
                    return;
                }

                const data = await response.json();
                currentUser = data.user;
                window._allowedTabs = data.allowed_tabs || ['dashboard'];

                // Reset active audit on full reload
                activeAudit = null;

                // Update user info
                document.getElementById('userName').textContent = currentUser.full_name || currentUser.email.split('@')[0];
                document.getElementById('userRole').textContent = data.role_info?.name || currentUser.role;
                document.getElementById('userAvatar').textContent = (currentUser.full_name || currentUser.email)[0].toUpperCase();

                // Build UI
                buildTopTabs();
                buildSideTabs();
                await loadClients();
                loadContent();

                lucide.createIcons();
            } catch (error) {
                console.error('Init error:', error);
                window.location.href = '/login.html';
            }
        }

        // =========================================================================
        // BUILD UI
        // =========================================================================
        function buildTopTabs() {
            const container = document.getElementById('topTabs');
            const allowed = window._allowedTabs || ['dashboard'];
            // Filter by role-allowed tabs AND client-only visibility
            const visibleTabs = TOP_TABS.filter(tab => {
                if (!allowed.includes(tab.id)) return false;
                if (tab.clientOnly && !currentClient) return false;
                return true;
            });
            container.innerHTML = visibleTabs.map(tab => `
                <button onclick="switchTopTab('${tab.id}')" 
                    class="top-tab flex items-center gap-1.5 text-sm text-gray-400 transition-colors ${tab.id === currentTopTab ? 'active' : ''}">
                    <i data-lucide="${tab.icon}" class="w-4 h-4"></i>
                    ${tab.label}
                </button>
            `).join('');
            lucide.createIcons();
        }

        function buildSideTabs() {
            const container = document.getElementById('sideTabs');
            let tabs = SIDE_TABS[currentTopTab] || [];
            
            // Filter tabs based on role
            if (currentTopTab === 'dashboard') {
                if (currentUser && currentUser.role === 'viewer') {
                    tabs = tabs.filter(t => t.id === 'overview' || t.id === 'settings');
                } else if (currentUser && currentUser.role !== 'admin') {
                    tabs = tabs.filter(t => t.id !== 'team'); // Only admins see team
                }
            }

            const titleMap = {
                'dashboard': 'Dashboard',
                'tech-audit': 'Tech Issues',
                'audit-2': 'Site Audit',
                'content': 'Content',
                'keywords': 'Keywords',
                'strategy': 'Strategy',
                'competitors': 'Competitors',
                'links': 'Link Building',
                'tasks': 'Tasks',
                'reports': 'Reports',
                'client-settings': 'Settings'
            };

            document.getElementById('sidebarTitle').textContent = titleMap[currentTopTab] || 'Navigation';

            container.innerHTML = tabs.map(tab => `
                <button onclick="switchSideTab('${tab.id}')" 
                    class="side-tab w-full flex items-center justify-between px-3 py-2 text-sm text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-colors ${tab.id === currentSideTab ? 'active' : ''}">
                    ${tab.label}
                </button>
            `).join('');
        }

        // =========================================================================
        // NAVIGATION
        // =========================================================================
        function switchTopTab(tabId) {
            currentTopTab = tabId;
            currentSideTab = SIDE_TABS[tabId]?.[0]?.id || 'overview';
            buildTopTabs();
            buildSideTabs();
            loadContent();
        }

        function switchSideTab(tabId) {
            currentSideTab = tabId;
            buildSideTabs();
            loadContent();
        }

        function selectSideTab(topTabId, sideTabId) {
            currentTopTab = topTabId;
            currentSideTab = sideTabId;
            buildTopTabs();
            buildSideTabs();
            loadContent();
        }

        // =========================================================================
        // CLIENT SELECTOR
        // =========================================================================
        async function loadClients() {
            try {
                const response = await fetch('/api/campaigns');
                const data = await response.json();
                clients = data.campaigns || [];

                const selector = document.getElementById('clientSelector');
                selector.innerHTML = '<option value="">Select Client...</option>' +
                    clients.map(c => `<option value="${c.id}">${c.name} (${c.domain})</option>`).join('');

                // Restore selected client from URL
                const params = new URLSearchParams(window.location.search);
                const clientId = params.get('client');
                if (clientId) {
                    selector.value = clientId;
                    currentClient = clients.find(c => c.id === clientId);
                    // Rebuild tabs to show client-only tabs (like Settings)
                    buildTopTabs();
                }
            } catch (error) {
                console.error('Error loading clients:', error);
            }
        }

        function selectClient(clientId, skipReload = false) {
            currentClient = clients.find(c => c.id === clientId) || null;
            
            // Update the display indicator
            const selector = document.getElementById('clientSelector');
            if (selector) {
                selector.value = clientId || '';
            }

            // Update URL
            const url = new URL(window.location);
            if (clientId) {
                url.searchParams.set('client', clientId);
            } else {
                url.searchParams.delete('client');
            }
            window.history.pushState({}, '', url);

            // Only reload if not being chained with another navigation action
            if (!skipReload) {
                loadContent();
            }
        }

        // =========================================================================
        // CONTENT LOADING
        // =========================================================================
        async function loadContent() {
            const contentArea = document.getElementById('contentArea');
            const pageTitle = document.getElementById('pageTitle');
            const pageActions = document.getElementById('pageActions');

            // Show loading
            contentArea.innerHTML = `<div class="flex items-center justify-center h-32 text-gray-500">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin mr-2"></i> Loading...
            </div>`;
            lucide.createIcons();

            // Set title
            const tab = TOP_TABS.find(t => t.id === currentTopTab);
            const sideTab = SIDE_TABS[currentTopTab]?.find(t => t.id === currentSideTab);
            pageTitle.textContent = sideTab?.label || tab?.label || 'Dashboard';

            // Load based on current tab
            if (currentTopTab === 'dashboard') {
                await loadDashboardContent();
            } else if (currentTopTab === 'audit-2') {
                await loadAudit2Content();
            } else if (!currentClient) {
                contentArea.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-gray-500">
                        <i data-lucide="folder-open" class="w-12 h-12 mb-4 text-gray-600"></i>
                        <p class="text-lg font-medium">Select a project to view data</p>
                        <p class="text-sm mt-1">Please select a project from the Dashboard tab</p>
                    </div>`;
                pageActions.innerHTML = '';
            } else {
                await loadTabContent();
            }

            lucide.createIcons();

        async function updateClientStatus(clientId, newStatus) {
            try {
                const response = await fetch(`/api/campaigns/${clientId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                
                // Update local data
                const client = clients.find(c => c.id === clientId);
                if (client) client.status = newStatus;
                
                // Reload the view to update UI colors
                switchSideTab('clients');
            } catch (error) {
                alert('Failed to update status: ' + error.message);
                switchSideTab('clients'); // Revert dropdown on error
            }
        }

        async function deleteClient(clientId) {
            if (!confirm('Are you sure you want to completely delete this client/campaign? This will delete all associated data, audits, and tasks.')) return;
            
            try {
                const response = await fetch(`/api/campaigns/${clientId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    // Update local list
                    clients = clients.filter(c => c.id !== clientId);
                    if (currentClient && currentClient.id === clientId) {
                        currentClient = null;
                        document.getElementById('clientSelector').value = '';
                        switchTopTab('dashboard'); // Redirect away from deleted client
                    }
                    
                    // Re-render
                    switchSideTab('clients');
                    // Refresh the selector
                    const selector = document.getElementById('clientSelector');
                    selector.innerHTML = '<option value="">Select Client...</option>' + 
                        clients.map(c => `<option value="${c.id}">${c.name} (${c.domain})</option>`).join('');
                } else {
                    alert('Failed to delete client: ' + data.error);
                }
            } catch (error) {
                alert('Error deleting client: ' + error.message);
            }
        }

        // =====================================================================
        // PREMIUM ANALYTICS DASHBOARD — HELPERS
        // =====================================================================
        function fmtK(n) {
            if (n === null || n === undefined) return '0';
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
            return new Intl.NumberFormat('en-US').format(n);
        }
        function fmtNum(n) {
            return new Intl.NumberFormat('en-US').format(n || 0);
        }
        function pctChange(curr, prev) {
            if (!prev || prev === 0) return null;
            return ((curr - prev) / prev * 100);
        }
        function changeBadgeHtml(curr, prev, invert = false) {
            const pct = pctChange(curr, prev);
            if (pct === null) return '<span class="text-xs text-gray-600">N/A</span>';
            const isPositive = pct >= 0;
            const isGood = invert ? !isPositive : isPositive;
            const arrow = isPositive ? '▲' : '▼';
            const color = isGood ? 'text-emerald-400' : 'text-red-400';
            return '<span class="text-xs font-medium ' + color + '">' + arrow + ' ' + Math.abs(pct).toFixed(1) + '%</span>';
        }
        function formatDuration(seconds) {
            if (!seconds) return '00:00:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }

        function toggleAllKeywords(source) {
            const checkboxes = document.querySelectorAll('.kw-checkbox');
            checkboxes.forEach(cb => cb.checked = source.checked);
            updateKeywordSelection();
        }

        function updateKeywordSelection() {
            const toolbar = document.getElementById('keywordActionToolbar');
            if (!toolbar) return;
            const selectedCount = document.querySelectorAll('.kw-checkbox:checked').length;
            document.getElementById('selectedKeywordCount').textContent = selectedCount;
            if (selectedCount > 0) {
                toolbar.classList.remove('hidden');
            } else {
                toolbar.classList.add('hidden');
            }
        }
        
        function filterGscKeywords(val) {
            const searchTerms = val.toLowerCase().trim().split(' ');
            const rows = document.querySelectorAll('.gsc-keyword-row');
            
            rows.forEach(row => {
                const query = row.getAttribute('data-query');
                if (!query) return;
                
                // Must match ALL search terms (like an AND search)
                const isMatch = searchTerms.every(term => query.includes(term));
                
                if (isMatch) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        function toggleAllTracked(source) {
            const checkboxes = document.querySelectorAll('.tracked-checkbox');
            checkboxes.forEach(cb => cb.checked = source.checked);
            updateTrackedSelection();
        }

        function updateTrackedSelection() {
            const toolbar = document.getElementById('trackedKeywordActionToolbar');
            if (!toolbar) return;
            const selectedCount = document.querySelectorAll('.tracked-checkbox:checked').length;
            document.getElementById('trackedSelectedCount').textContent = selectedCount;
            if (selectedCount > 0) {
                toolbar.classList.remove('hidden');
            } else {
                toolbar.classList.add('hidden');
            }
        }

        function bulkRemoveTracked() {
            const checkboxes = document.querySelectorAll('.tracked-checkbox:checked');
            const keywords = Array.from(checkboxes).map(cb => cb.value);
            if (keywords.length > 0) {
                removeTrackedKeywords(keywords);
            }

        async function saveTrackedKeywords() {
            if (!currentClient) return;
            
            const btn = document.getElementById('saveTrackedBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Pushing...';
                lucide.createIcons();
            }
            
            const checkboxes = document.querySelectorAll('.kw-checkbox:checked');
            const keywords = Array.from(checkboxes).map(cb => cb.value);
            
            if (keywords.length === 0) {
                if (btn) { btn.disabled = false; btn.innerHTML = 'Push to Tracked'; }
                return;
            }

            try {
                const response = await fetch(`/api/campaigns/${currentClient.id}/keywords`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keywords })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentClient.tracked_keywords = data.keywords;
                    showToast(`${keywords.length} keyword${keywords.length > 1 ? 's' : ''} pushed to tracking!`, 'success');
                    
                    // Re-render the view to clear checkboxes and update Status badges
                    renderAnalyticsDashboard();
                } else {
                    if (btn) { btn.disabled = false; btn.innerHTML = 'Push to Tracked'; }
                    showToast('Failed to save keywords', 'error');
                }
            } catch (error) {
                console.error(error);
                if (btn) { btn.disabled = false; btn.innerHTML = 'Push to Tracked'; }
                showToast('Error saving keywords', 'error');
            }
        }

        async function removeTrackedKeywords(keywords) {
            if (!currentClient || !confirm(`Remove ${keywords.length} keyword${keywords.length > 1 ? 's' : ''} from tracked keywords?`)) return;

            // Optional: update button state if it's the bulk remove button
            const btn = document.getElementById('bulkRemoveBtn');
            if (btn && keywords.length > 1) {
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Removing...';
                lucide.createIcons();
            }

            try {
                const response = await fetch(`/api/campaigns/${currentClient.id}/keywords`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keywords: keywords })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentClient.tracked_keywords = data.keywords;
                    showToast(`${keywords.length} keyword${keywords.length > 1 ? 's' : ''} removed`, 'success');
                    
                    // Re-render whatever view we are on
                    if (currentTopTab === 'reports' && currentSideTab === 'tracked-keywords') {
                        loadTrackedKeywordsDashboard();

        // =====================================================================
        // PREMIUM CHART INITIALIZATION
        // =====================================================================
        function initPremiumCharts(gsc, ga4, tpl, ac, acRgb) {
            const chartFont = { family: "'Inter','system-ui',sans-serif", size: 10 };
            const gridColor = 'rgba(255,255,255,0.04)';
            const tickColor = '#6b7280';

            // ---- LINE CHART ----
            const lineEl = document.getElementById('premiumLineChart');
            if (lineEl) {
                const ctx = lineEl.getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, 0, lineEl.height * 2);
                gradient.addColorStop(0, 'rgba('+acRgb+',0.25)');
                gradient.addColorStop(1, 'rgba('+acRgb+',0)');

                let labels, dataCurr, dataPrev;
                if (tpl === 'gsc') {
                    labels = (gsc.timeseries||[]).map(r => { const d = new Date(r.date); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); });
                    dataCurr = (gsc.timeseries||[]).map(r => r.impressions);
                    dataPrev = (gsc.prevTimeseries||[]).map(r => r.impressions);
                } else {
                    labels = (ga4.timeseries||[]).map(r => { const d = new Date(r.date); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); });
                    dataCurr = (ga4.timeseries||[]).map(r => r.sessions);
                    dataPrev = (ga4.prevTimeseries||[]).map(r => r.sessions);
                }
                if (window.premiumLineChartInstance) window.premiumLineChartInstance.destroy();
                window.premiumLineChartInstance = new Chart(lineEl, {
                    type: 'line',
                    data: { labels, datasets: [
                        { label: tpl==='gsc'?'Impressions':'Sessions', data: dataCurr, borderColor: ac, backgroundColor: gradient, fill: true, tension: 0.35, borderWidth: 2, pointRadius: 2, pointBackgroundColor: ac, pointBorderColor: ac, pointHoverRadius: 5 },
                        { label: 'Previous ' + (_analyticsData && _analyticsData.meta && _analyticsData.meta.duration_days ? _analyticsData.meta.duration_days + 'd' : ''), data: dataPrev, borderColor: '#4b5563', borderDash: [5,5], fill: false, tension: 0.35, borderWidth: 1.5, pointRadius: 0 }
                    ]},
                    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false, backgroundColor: '#1f2937', titleColor: '#e5e7eb', bodyColor: '#9ca3af', borderColor: '#374151', borderWidth: 1 } }, scales: { x: { grid: { color: gridColor }, ticks: { color: tickColor, font: chartFont, maxTicksLimit: 10 } }, y: { grid: { color: gridColor }, ticks: { color: tickColor, font: chartFont, callback: v => fmtK(v) } } }, interaction: { mode: 'nearest', axis: 'x', intersect: false } }
                });
            }

            // ---- DONUT CHART ----
            const donutEl = document.getElementById('premiumDonut');
            if (donutEl) {
                const devColors = { 'DESKTOP': '#6366f1', 'desktop': '#6366f1', 'MOBILE': ac, 'mobile': ac, 'TABLET': '#f59e0b', 'tablet': '#f59e0b' };
                let devData, devLabels, devMetric;
                if (tpl === 'gsc') {
                    devLabels = (gsc.devices||[]).map(d => d.device);
                    devData = (gsc.devices||[]).map(d => d.impressions);
                    devMetric = 'impressions';
                } else {
                    devLabels = (ga4.devices||[]).map(d => d.device);
                    devData = (ga4.devices||[]).map(d => d.sessions);
                    devMetric = 'sessions';
                }
                if (window.premiumDonutInstance) window.premiumDonutInstance.destroy();
                window.premiumDonutInstance = new Chart(donutEl, {
                    type: 'doughnut',
                    data: { labels: devLabels, datasets: [{ data: devData, backgroundColor: devLabels.map(l => devColors[l]||'#8b5cf6'), borderWidth: 0, hoverBorderWidth: 2, hoverBorderColor: '#fff' }] },
                    options: { responsive: true, maintainAspectRatio: true, cutout: '68%', plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1f2937', titleColor: '#e5e7eb', bodyColor: '#9ca3af' } } }
                });
                const legendEl = document.getElementById('premiumDonutLegend');
                if (legendEl) {
                    const total = devData.reduce((a,b)=>a+b,0);
                    const devices = tpl === 'gsc' ? (gsc.devices||[]) : (ga4.devices||[]);
                    legendEl.innerHTML = devices.map(d => {
                        const val = tpl==='gsc' ? d.impressions : d.sessions;
                        const pct = total > 0 ? ((val/total)*100).toFixed(1) : '0';
                        const color = devColors[d.device] || '#8b5cf6';
                        const label = (d.device||'').charAt(0).toUpperCase() + (d.device||'').slice(1).toLowerCase();
                        return '<div class="mb-3"><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm" style="background:'+color+'"></span><span class="text-xs text-gray-400 uppercase">'+label+'</span></div><div class="text-xl font-bold text-white">'+fmtK(val)+'</div><div class="text-xs" style="color:'+color+'">'+pct+'%</div></div>';
                    }).join('');
                }
            }

            // ---- CHANNEL DONUT (GA4 overview) ----
            const chDonutEl = document.getElementById('premiumChannelDonut');
            if (chDonutEl && ga4.channels) {
                const chColors = [ac, '#6366f1', '#10b981', '#ef4444', '#f59e0b', '#8b5cf6', '#14b8a6', '#ec4899'];
                const chLabels = (ga4.channels||[]).slice(0,6).map(c => c.channel);
                const chData = (ga4.channels||[]).slice(0,6).map(c => c.sessions);
                if (window.premiumChDonutInstance) window.premiumChDonutInstance.destroy();
                window.premiumChDonutInstance = new Chart(chDonutEl, {
                    type: 'doughnut',
                    data: { labels: chLabels, datasets: [{ data: chData, backgroundColor: chColors.slice(0, chLabels.length), borderWidth: 0 }] },
                    options: { responsive: true, maintainAspectRatio: true, cutout: '55%', plugins: { legend: { display: false } } }
                });
            }

            // ---- CHANNEL BAR CHART ----
            const chBarEl = document.getElementById('premiumChannelBar');
            if (chBarEl && ga4.channels) {
                const chColors2 = [ac, '#6366f1', '#10b981', '#ef4444', '#f59e0b', '#8b5cf6', '#14b8a6', '#ec4899'];
                if (window.premiumChBarInstance) window.premiumChBarInstance.destroy();
                window.premiumChBarInstance = new Chart(chBarEl, {
                    type: 'bar',
                    data: { labels: (ga4.channels||[]).map(c => c.channel), datasets: [{ label: 'Sessions', data: (ga4.channels||[]).map(c => c.sessions), backgroundColor: (ga4.channels||[]).map((_,i) => chColors2[i%chColors2.length]), borderRadius: 4, barThickness: 18 }] },
                    options: { responsive: true, maintainAspectRatio: true, indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1f2937' } }, scales: { x: { grid: { color: gridColor }, ticks: { color: tickColor, font: chartFont, callback: v => fmtK(v) } }, y: { grid: { display: false }, ticks: { color: '#d1d5db', font: { ...chartFont, size: 11 } } } } }
                });
            }
        }

        async function saveClientSettings() {
            if (!currentClient) return;

            // Collect all settings from current page
            const settings = { ...currentClient.settings };

            // General
            const name = document.getElementById('setting_name');
            const domain = document.getElementById('setting_domain');
            const language = document.getElementById('setting_language');
            const location = document.getElementById('setting_location');

            if (language) settings.language = language.value;
            if (location) settings.location = location.value;

            // Google
            const gscProperty = document.getElementById('setting_gsc_property');
            const ga4Property = document.getElementById('setting_ga4_property');
            if (gscProperty) settings.gsc_property = gscProperty.value;
            if (ga4Property) settings.ga4_property = ga4Property.value;

            // CMS
            const wpUrl = document.getElementById('setting_wp_url');
            const wpUser = document.getElementById('setting_wp_user');
            const wpAppPassword = document.getElementById('setting_wp_app_password');
            const shopifyStore = document.getElementById('setting_shopify_store');
            const shopifyToken = document.getElementById('setting_shopify_token');
            if (wpUrl) settings.wp_url = wpUrl.value;
            if (wpUser) settings.wp_user = wpUser.value;
            if (wpAppPassword) settings.wp_app_password = wpAppPassword.value;
            if (shopifyStore) settings.shopify_store = shopifyStore.value;
            if (shopifyToken) settings.shopify_token = shopifyToken.value;

            // Analytics
            const clarityId = document.getElementById('setting_clarity_id');
            const ahrefsToken = document.getElementById('setting_ahrefs_token');
            if (clarityId) settings.clarity_id = clarityId.value;
            if (ahrefsToken) settings.ahrefs_token = ahrefsToken.value;

            // Competitors
            const competitorInputs = document.querySelectorAll('.competitor-input');
            if (competitorInputs.length) {
                settings.competitors = Array.from(competitorInputs).map(i => i.value).filter(v => v.trim());
            }

            // Prepare update data
            const updateData = { settings };
            if (name) updateData.name = name.value;
            if (domain) updateData.domain = domain.value;

            try {
                const res = await fetch(`/api/campaigns/${currentClient.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                if (res.ok) {
                    const { campaign } = await res.json();
                    // Update local state
                    currentClient = campaign;
                    const idx = clients.findIndex(c => c.id === campaign.id);
                    if (idx >= 0) clients[idx] = campaign;

                    showModal(`
                    <div class="p-6 text-center">
                            <div class="w-12 h-12 mx-auto mb-4 bg-emerald-500/20 rounded-full flex items-center justify-center">
                                <i data-lucide="check" class="w-6 h-6 text-emerald-400"></i>
                            </div>
                            <h3 class="text-lg font-semibold text-white mb-2">Settings Saved</h3>
                            <p class="text-gray-400 text-sm mb-4">Client settings have been updated.</p>
                            <button onclick="hideModal()" class="bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded-lg text-sm font-medium">OK</button>
                        </div>
                    `);
                    lucide.createIcons();
                } else {
                    const err = await res.json();
                    alert(err.error || 'Failed to save settings');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function changePassword(e) {
            e.preventDefault();
            const form = e.target;
            const current_password = form.current_password.value;
            const new_password = form.new_password.value;
            const confirm_password = form.confirm_password.value;

            if (new_password !== confirm_password) {
                alert("New passwords do not match");
                return;
            }

            const btn = form.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Updating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password, new_password })
                });

                const data = await res.json();

                if (res.ok) {
                    showModal(`
                    <div class="p-6 text-center">
                                <div class="w-12 h-12 mx-auto mb-4 bg-emerald-500/20 rounded-full flex items-center justify-center">
                                    <i data-lucide="check" class="w-6 h-6 text-emerald-400"></i>
                                </div>
                                <h3 class="text-lg font-semibold text-white mb-2">Password Updated</h3>
                                <p class="text-gray-400 text-sm mb-4">Your password has been changed successfully.</p>
                                <button onclick="hideModal()" class="bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded-lg text-sm font-medium">OK</button>
                            </div>
                    `);

            const data = {
                name: form.domain.value,
                domain: form.domain.value,
                settings: {
                    language: form.language.value,
                    location: form.location.value,
                    focus: form.focus.value
                }
            };

            try {
                const res = await fetch('/api/campaigns', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },

        async function submitInvite() {
            const email = document.getElementById('inviteEmail').value.trim();
            const role = document.getElementById('inviteRole').value;
            const checks = document.querySelectorAll('.invite-campaign-check:checked');
            const assignedCampaigns = Array.from(checks).map(c => c.value);
            const resultDiv = document.getElementById('inviteResult');
            const btn = document.getElementById('inviteSubmitBtn');

            if (!email) { alert('Please enter an email address.'); return; }

            btn.disabled = true;
            btn.textContent = 'Creating invite...';

            try {
                const resp = await fetch('/api/team/invite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, role, assigned_campaigns: assignedCampaigns })
                });
                const data = await resp.json();

                if (data.success) {
                    const link = `${window.location.origin}/signup.html?invite=${data.invite_token}&email=${encodeURIComponent(email)}&role=${role}`;
                    resultDiv.innerHTML = `
                        <div class="bg-emerald-900/20 border border-emerald-700/50 rounded-lg p-3">
                            <p class="text-emerald-400 text-sm font-medium mb-2">✅ Invite created!</p>

                                <input type="text" value="${link}" readonly class="flex-1 bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 focus:outline-none">
                                <button onclick="navigator.clipboard.writeText('${link}'); this.textContent='Copied!'" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-xs font-medium">Copy</button>
                            </div>
                            <p class="text-xs text-gray-500 mt-2">Share this link with ${email} to let them join.</p>
                        </div>
                    `;
                    resultDiv.classList.remove('hidden');
                    btn.textContent = 'Done';
                    btn.disabled = false;
                    btn.onclick = () => {
                        hideModal();
                        loadContent();
                    };
                } else {
                    throw new Error(data.error || 'Failed to create invite');
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="text-red-400 text-sm">${error.message}</p>`;
                resultDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Send Invite';
            }
        }

        async function runAudit(isCompetitor = false, competitorDomain = null, maxPages = 200) {
            if (!confirm(isCompetitor ? 'Start a comprehensive technical audit for this competitor?' : 'Start a new comprehensive technical audit? This usually takes a few minutes depending on page count.')) return;

            const btn = event.currentTarget || document.querySelector('button[onclick*="runAudit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Starting...`;
            btn.disabled = true;

            // Show loading state immediately based on view
            if (!isCompetitor) {
                loadAuditContent();
            } else {
                loadCompetitorContent();
            }

            try {
                const payload = {
                    campaign_id: currentClient.id,
                    max_pages: maxPages
                };
                if (isCompetitor && competitorDomain) {
                    payload.type = 'competitor';
                    payload.competitor_domain = competitorDomain;
                } else {
                    payload.type = 'technical';
                }

                const response = await fetch('/api/audits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Failed to start audit');

                if (!isCompetitor) {
                    await loadAuditContent();
                } else {
                    await loadCompetitorContent();
                }
            } catch (error) {
                alert('Error: ' + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function checkAuditStatus(auditId) {
            try {
                const response = await fetch(`/api/audits/${auditId}`);
                const data = await response.json();

                if (data.audit && data.audit.status === 'completed') {
                    // It finished! Reload the appropriate list
                    if (data.audit.type === 'competitor') {
                        await loadCompetitorContent();
                    } else {
                        await loadAuditContent();
                    }
                } else {
                    // Still running, maybe show a toast
                    const btn = document.querySelector(`button[onclick="checkAuditStatus('${auditId}')"]`);
                    if (btn) {
                        const original = btn.innerHTML;
                        btn.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-emerald-400"></i> Still running...`;
                        setTimeout(() => btn.innerHTML = original, 2000);
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function viewAuditResults(auditId) {
            try {
                // Show loading state
                const btn = document.querySelector(`button[onclick="viewAuditResults('${auditId}')"]`);
                if (btn) btn.innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> Loading...`;

                const response = await fetch(`/api/audits/${auditId}`);
                const data = await response.json();

                if (data.audit) {
                    activeAudit = data.audit;
                    loadContent();
                }
            } catch (e) {
                console.error(e);
                alert('Failed to load audit results');
            }
        }

        // ==========================================================================
        // COMPETITOR SCORECARD (Brand Authority + Funnel + Multi-Param Scoring)

            const container = document.getElementById('scorecardContainer');
            if (!container) return;
            
            try {
                const resp = await fetch(`/api/competitors/scorecard?campaign_id=${campaignId}`);

                if (!data.success || !data.scorecards || data.scorecards.length === 0) {
                    container.innerHTML = '';
                    return;
                }
                
                const cards = data.scorecards;
                
                // Helper: score color
                const scoreColor = (s) => s >= 70 ? 'text-emerald-400' : s >= 40 ? 'text-amber-400' : 'text-red-400';
                const scoreBg = (s) => s >= 70 ? 'bg-emerald-500' : s >= 40 ? 'bg-amber-500' : 'bg-red-500';

                let html = `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">

                            <h3 class="text-lg font-semibold text-white flex items-center gap-2">

                                Competitive Scorecard

                            <span class="text-xs text-gray-500">${cards.length} domains analyzed</span>
                        </div>
                        
                        <!-- Score Cards Grid -->
                        <div class="p-4 space-y-4">
                `;
                
                for (const card of cards) {
                    const isClient = card.is_client;
                    const borderClass = isClient ? 'border-violet-500/40 bg-violet-900/10' : 'border-gray-700 bg-gray-800/30';
                    const badge = isClient ? '<span class="bg-violet-600/30 text-violet-400 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">You</span>' : '';
                    
                    const ba = card.brand_authority || 0;
                    const cs = card.competitive_score || 0;
                    const fs = card.funnel_score || {};
                    const pb = card.parameter_breakdown || {};
                    
                    html += `
                        <div class="border ${borderClass} rounded-xl p-4">
                            <div class="flex items-center justify-between mb-4">
                                <div class="flex items-center gap-2">
                                    <span class="font-semibold text-white text-sm">${card.domain}</span>

                                    </div>
                                    <div class="text-center">

                                            <span class="text-sm font-bold ${scoreColor(cs)}">${cs}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Funnel Distribution -->
                            <div class="mb-3">
                                <div class="text-[10px] uppercase tracking-wider text-gray-500 mb-1.5">Funnel Orientation</div>
                                <div class="flex h-3 rounded-full overflow-hidden bg-gray-700">
                                    ${fs.tofu ? `<div class="bg-blue-500 transition-all" style="width:${fs.tofu}%" title="ToFu: ${fs.tofu}%"></div>` : ''}
                                    ${fs.mofu ? `<div class="bg-amber-500 transition-all" style="width:${fs.mofu}%" title="MoFu: ${fs.mofu}%"></div>` : ''}
                                    ${fs.bofu ? `<div class="bg-emerald-500 transition-all" style="width:${fs.bofu}%" title="BoFu: ${fs.bofu}%"></div>` : ''}

                                <div class="flex justify-between mt-1 text-[10px]">

        function startSlideGeneration(auditId, templateType = 'default') {
            // Show loading modal
            const modal = document.createElement('div');
            modal.id = 'slideGenModal';
            modal.className = 'fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm';
            modal.innerHTML = `
                        <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 max-w-md w-full mx-4 shadow-2xl text-center">
                    <div class="mb-6">
                        <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2">Generating Presentation</h3>
                    <p id="slideGenStatus" class="text-gray-400 text-sm mb-4">Loading audit data & running analysis...</p>
                    <div class="w-full bg-gray-800 rounded-full h-2 mb-4">
                        <div id="slideGenProgress" class="bg-indigo-500 h-2 rounded-full transition-all duration-500" style="width: 10%"></div>
                    </div>
                    <p class="text-gray-500 text-xs">This may take 1-2 minutes. Do not close this window.</p>
                </div>
                        `;
            document.body.appendChild(modal);
            lucide.createIcons();

            // Progress updates
            const updateProgress = (pct, text) => {
                const bar = document.getElementById('slideGenProgress');
                const status = document.getElementById('slideGenStatus');
                if (bar) bar.style.width = pct + '%';
                if (status) status.textContent = text;
            };

            // Simulate progress stages
            setTimeout(() => updateProgress(20, 'Running PageSpeed & readability analysis...'), 2000);
            setTimeout(() => updateProgress(40, 'Rendering audit dashboard...'), 5000);
            setTimeout(() => updateProgress(60, 'Capturing screenshots...'), 10000);
            setTimeout(() => updateProgress(75, 'Building Google Slides presentation...'), 20000);

            // Create hidden iframe — pass template_type
            const iframe = document.createElement('iframe');
            iframe.id = 'slideGenIframe';
            iframe.src = `/audit-dashboard.html?audit_id=${auditId}&auto_generate=true&template_type=${templateType}&role=${currentUser?.role || ''}`;
            iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1400px;height:900px;opacity:0;pointer-events:none;';
            document.body.appendChild(iframe);

            // Listen for postMessage from iframe
            const messageHandler = (event) => {
                if (event.data?.type === 'slides-ready') {
                    window.removeEventListener('message', messageHandler);

                    updateProgress(100, 'Presentation ready!');

                    // Save the slides_url to the audit record
                    fetch(`/ api / audits / ${auditId}/slides-url`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ slides_url: event.data.presentation_url })
                    }).catch(e => console.warn('Could not save slides URL:', e));

                    setTimeout(() => {
                        // Remove iframe and modal
                        const iframeEl = document.getElementById('slideGenIframe');
                        if (iframeEl) iframeEl.remove();

                        // Replace modal content with success
                        const modalEl = document.getElementById('slideGenModal');
                        if (modalEl) {
                            modalEl.innerHTML = `
                                <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 max-w-md w-full mx-4 shadow-2xl text-center">
                                    <div class="text-5xl mb-4">✅</div>
                                    <h3 class="text-xl font-bold text-white mb-2">Presentation Ready!</h3>
                                    <p class="text-gray-400 text-sm mb-6">Your Google Slides presentation has been created.</p>
                                    <div class="flex gap-3 justify-center">
                                        <a href="${event.data.presentation_url}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-lg font-medium flex items-center gap-2">
                                            <i data-lucide="external-link" class="w-4 h-4"></i> Open Presentation
                                        </a>
                                        <button onclick="document.getElementById('slideGenModal').remove()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2.5 rounded-lg font-medium border border-gray-700">
                                            Close
                                        </button>
                                    </div>
                                </div>
                            `;
                            lucide.createIcons();
                        }
                    }, 1000);

                } else if (event.data?.type === 'slides-error') {
                    window.removeEventListener('message', messageHandler);

                    const iframeEl = document.getElementById('slideGenIframe');
                    if (iframeEl) iframeEl.remove();

                    const modalEl = document.getElementById('slideGenModal');
                    if (modalEl) {
                        modalEl.innerHTML = `
                            <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 max-w-md w-full mx-4 shadow-2xl text-center">
                                <div class="text-5xl mb-4">❌</div>
                                <h3 class="text-xl font-bold text-white mb-2">Generation Failed</h3>
                                <p class="text-red-400 text-sm mb-6">${event.data.error || 'Unknown error occurred'}</p>
                                <button onclick="document.getElementById('slideGenModal').remove()" class="bg-gray-800 hover:bg-gray-700 text-white px-6 py-2.5 rounded-lg font-medium border border-gray-700">
                                    Close
                                </button>
                            </div>
                        `;
                    }
                }
            };
            window.addEventListener('message', messageHandler);

            // Timeout after 3 minutes
            setTimeout(() => {
                const iframeEl = document.getElementById('slideGenIframe');
                if (iframeEl) {
                    iframeEl.remove();
                    window.removeEventListener('message', messageHandler);

                    const modalEl = document.getElementById('slideGenModal');
                    if (modalEl) {
                        modalEl.innerHTML = `
                            <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 max-w-md w-full mx-4 shadow-2xl text-center">
                                <div class="text-5xl mb-4">⏰</div>
                                <h3 class="text-xl font-bold text-white mb-2">Generation Timed Out</h3>
                                <p class="text-gray-400 text-sm mb-6">The process took too long. Please try again.</p>
                                <button onclick="document.getElementById('slideGenModal').remove()" class="bg-gray-800 hover:bg-gray-700 text-white px-6 py-2.5 rounded-lg font-medium border border-gray-700">
                                    Close
                                </button>
                            </div>
                        `;
                    }
                }
            }, 300000); // 5 min timeout (PageSpeed can take ~90s for heavy sites)
        }

        async function handleAddCompetitorSubmit(event) {
            const btn = event ? event.currentTarget : null;
            let originalText = '';
            if (btn) {
                originalText = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Starting...`;
                btn.disabled = true;
            }

            const input1 = document.getElementById('competitorDomainInput1');
            const input2 = document.getElementById('competitorDomainInput2');
            const input3 = document.getElementById('competitorDomainInput3');
            const limitInput = document.getElementById('competitorPageLimitInput');
            
            let domains = [];
            if (input1 && input1.value.trim()) domains.push(input1.value.trim());
            if (input2 && input2.value.trim()) domains.push(input2.value.trim());
            if (input3 && input3.value.trim()) domains.push(input3.value.trim());

            if (domains.length < 1) {
                alert("Please provide at least 1 competitor to add.");
                if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
                return;
            }

            let maxPages = 200;
            if (limitInput && limitInput.value) {
                maxPages = parseInt(limitInput.value);
            }

            // Store competitor country for gap analysis calls
            window.lastCompetitorCountry = (document.getElementById('competitorCountryInput')?.value) || (currentClient?.settings?.location) || 'US';

            // Run audit for each domain in parallel
            const fetchPromises = domains.map(d => {
                let cleanDomain = d.replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
                return fetch('/api/audits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        campaign_id: currentClient.id,
                        max_pages: maxPages,
                        type: 'competitor',
                        competitor_domain: cleanDomain,
                        competitor_country: window.lastCompetitorCountry || 'US'
                    })
                }).catch(e => {
                    console.error("Error adding competitor:", cleanDomain, e);
                });
            });

            await Promise.all(fetchPromises);

            document.getElementById('addCompetitorModal').classList.add('hidden');
            if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
            
            // Clear inputs for next time
            if (input1) input1.value = '';
            if (input2) input2.value = '';
            if (input3) input3.value = '';
            
            loadCompetitorContent();
        }

        async function runCompetitorAnalysis() {
            const inputs = document.querySelectorAll('.competitor-input');
            const competitors = Array.from(inputs).map(i => i.value.trim()).filter(v => v);

            if (competitors.length === 0) {
                alert('Please enter at least one competitor domain.');
                return;
            }

            const btn = document.querySelector('button[onclick="runCompetitorAnalysis()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Analyzing...`;
            btn.disabled = true;

            try {
                const response = await fetch('/api/competitors/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        campaign_id: currentClient.id,
                        competitors: competitors
                    })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Analysis failed');

                // Reload client data to get updated settings
                const clientRes = await fetch(`/api/campaigns/${currentClient.id}`);
                const clientData = await clientRes.json();
                currentClient = clientData.campaign;

                // Refresh content
                await loadCompetitorContent();

            } catch (error) {
                alert('Error: ' + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function getSOPForTask(taskTitle) {
            // Match SOP by checking if the task title starts with any SOP key
            for (const [key, sop] of Object.entries(TASK_SOP_MAP)) {
                if (taskTitle.startsWith(key)) return sop;
            }
            return null;
        }

        const _sopCache = {};

        async function fetchSOPForTask(issueKey) {
            if (_sopCache[issueKey]) return _sopCache[issueKey];
            try {
                const res = await fetch(`/api/sops?issue_key=${encodeURIComponent(issueKey)}`);
                const data = await res.json();
                if (data.sop) {
                    _sopCache[issueKey] = data.sop;
                    return data.sop;
                }
            } catch(e) { console.warn('SOP fetch failed, using fallback', e); }
            const fallback = getSOPForTask(issueKey);
            if (fallback) return { issue_key: issueKey, issue_description: fallback.issue, steps: fallback.steps.map((s,i) => ({order:i+1, text:s})), notes: [], source: 'local' };
            return null;
        }

        async function submitSOPNote(sopId) {
            const input = document.getElementById('sopNoteInput');
            const typeSelect = document.getElementById('sopNoteType');
            const content = input?.value?.trim();
            if (!content) return;
            try {
                const res = await fetch(`/api/sops/${sopId}/notes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, note_type: typeSelect?.value || 'tip' })
                });
                if (res.ok) {
                    input.value = '';
                    // Invalidate cache and re-open
                    const modal = document.getElementById('taskDetailModal');
                    const taskId = modal?.dataset?.taskId;
                    delete _sopCache[Object.keys(_sopCache).find(k => _sopCache[k]?.id === sopId)];
                    showNotification('Note added!', 'success');
                }
            } catch(e) { console.error('Failed to submit note', e); }
        }

        window.toggleSopEditMode = function() {
            const view = document.getElementById('sopViewMode');
            const edit = document.getElementById('sopEditMode');
            if (view && edit) {
                view.classList.toggle('hidden');
                edit.classList.toggle('hidden');
            }
        };

        window.saveSopEdit = async function(sopId) {
            if (!sopId || sopId === 'undefined') return;
            const issueDesc = document.getElementById('editSopIssue')?.value || '';
            const stepsRaw = document.getElementById('editSopSteps')?.value || '';
            
            // Convert newline-separated string back to step array objects
            const steps = stepsRaw.split('\n')
                .map(s => s.trim())
                .filter(s => s.length > 0)
                .map((text, i) => ({ order: i + 1, text: text }));

            try {
                const res = await fetch(`/api/sops/${sopId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ issue_description: issueDesc, steps: steps })
                });
                
                if (res.ok) {
                    // Clear cache so it fetches fresh data on next open
                    delete _sopCache[Object.keys(_sopCache).find(k => _sopCache[k]?.id === sopId)];
                    showNotification('SOP updated successfully', 'success');
                    
                    // Close the modal (user can reopen to see changes)
                    document.getElementById('taskDetailModal')?.remove();
                } else {
                    const err = await res.json();
                    showNotification(err.error || 'Failed to update SOP', 'error');
                }

        async function generateSchemaMarkup() {
            const btn = document.getElementById('schemaGenBtn');

                brandConfig = bcData.brand_config || {};

            // Get pages from latest audit
            let pages = [];
            try {
                const audRes = await fetch(`/api/audits?campaign_id=${currentClient.id}`);

                const audits = audData.audits || [];

                    const detRes = await fetch(`/api/audits/${latest.id}`);
                    const detData = await detRes.json();
                    const auditPages = detData.audit?.pages || [];
                    pages = auditPages.slice(0, 20).map(p => ({
                        url: p.url || '',
                        title: (p.meta?.title) || ''
                    }));
                }
            } catch(e) {}

            if (pages.length === 0) {
                // Fallback: use domain homepage
                pages = [{ url: 'https://' + (currentClient.domain || ''), title: 'Homepage' }];
            }

            try {
                const res = await fetch('/api/generate-schema-markup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({

                        brand_config: brandConfig,
                        domain: currentClient.domain || ''
                    })
                });

                if (data.error) throw new Error(data.error);

                _schemaData = data.schema;
                results.innerHTML = renderSchemaCards(_schemaData);
                lucide.createIcons();
            } catch(error) {
                results.innerHTML = '<div class="bg-red-900/20 border border-red-800 rounded-xl p-6 text-center"><span class="text-red-400">Error:</span> <span class="text-gray-400">' + error.message + '</span></div>';

        function escapeHtml(text) {

        function copySchemaCode(btn) {
            const pre = btn.parentElement.querySelector('pre code');
            navigator.clipboard.writeText(pre.textContent).then(() => {

                setTimeout(() => {

        function renderAnchorDashboard(data) {
            const dist = data.distribution || {};
            const ideal = data.ideal_ratios || {};
            const warnings = data.warnings || [];

            const catColors = {
                branded: { bg: 'bg-blue-500', text: 'text-blue-400', border: 'border-blue-900/50', bgLight: 'bg-blue-900/30' },
                exact_match: { bg: 'bg-red-500', text: 'text-red-400', border: 'border-red-900/50', bgLight: 'bg-red-900/30' },
                partial_match: { bg: 'bg-amber-500', text: 'text-amber-400', border: 'border-amber-900/50', bgLight: 'bg-amber-900/30' },
                naked_url: { bg: 'bg-emerald-500', text: 'text-emerald-400', border: 'border-emerald-900/50', bgLight: 'bg-emerald-900/30' },
                generic: { bg: 'bg-gray-500', text: 'text-gray-400', border: 'border-gray-700', bgLight: 'bg-gray-800' },
                other: { bg: 'bg-purple-500', text: 'text-purple-400', border: 'border-purple-900/50', bgLight: 'bg-purple-900/30' }
            };

            const catLabels = {
                branded: 'Branded', exact_match: 'Exact Match', partial_match: 'Partial Match',
                naked_url: 'Naked URL', generic: 'Generic', other: 'Other'
            };

            let html = '';

            // Summary cards
            html += `
                <div class="grid grid-cols-3 gap-3 mb-4">
                    <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-center">
                        <div class="text-2xl font-bold text-white">${(data.total_anchors || 0).toLocaleString()}</div>
                        <div class="text-[10px] text-gray-500 uppercase">Unique Anchors</div>
                    </div>
                    <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-center">
                        <div class="text-2xl font-bold text-violet-400">${(data.total_backlinks || 0).toLocaleString()}</div>
                        <div class="text-[10px] text-gray-500 uppercase">Total Backlinks</div>
                    </div>
                    <div class="bg-gray-900 border ${warnings.length > 0 ? 'border-amber-900/50' : 'border-emerald-900/50'} rounded-lg p-3 text-center">
                        <div class="text-2xl font-bold ${warnings.length > 0 ? 'text-amber-400' : 'text-emerald-400'}">${warnings.length}</div>
                        <div class="text-[10px] ${warnings.length > 0 ? 'text-amber-400/70' : 'text-emerald-400/70'} uppercase">${warnings.length > 0 ? 'Warnings' : 'All Clear'}</div>
                    </div>
                </div>
            `;

            // Warnings
            if (warnings.length > 0) {
                html += '<div class="bg-amber-900/10 border border-amber-800/40 rounded-xl p-4 mb-4">';
                html += '<div class="text-xs text-amber-400 font-semibold mb-2 flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3 h-3"></i> Anchor Profile Warnings</div>';
                warnings.forEach(w => {
                    html += '<div class="text-xs text-gray-300 py-0.5">• ' + w + '</div>';
                });
                html += '</div>';
            }

            // Distribution bars — current vs ideal
            html += '<div class="bg-gray-900 border border-gray-800 rounded-xl p-5 mb-4">';
            html += '<h3 class="text-white font-semibold mb-4 flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-4 h-4 text-gray-400"></i>Anchor Distribution vs Ideal</h3>';

            const cats = ['branded', 'exact_match', 'partial_match', 'naked_url', 'generic', 'other'];
            cats.forEach(cat => {
                const d = dist[cat] || { percentage: 0, count: 0, backlinks: 0 };
                const id = ideal[cat] || { min: 0, max: 100 };
                const col = catColors[cat];
                const isOk = d.percentage >= id.min && d.percentage <= id.max;
                const isOver = d.percentage > id.max;

                html += `
                    <div class="mb-3">
                        <div class="flex items-center justify-between mb-1">
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 rounded ${col.bg}"></div>
                                <span class="text-xs text-gray-300">${catLabels[cat]}</span>
                                <span class="text-[10px] text-gray-500">(${d.count} anchors, ${d.backlinks} links)</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold ${isOk ? 'text-emerald-400' : isOver ? 'text-red-400' : 'text-amber-400'}">${d.percentage}%</span>
                                <span class="text-[10px] text-gray-500">ideal ${id.min}-${id.max}%</span>
                            </div>
                        </div>
                        <div class="relative bg-gray-800 rounded-full h-3">
                            <div class="${col.bg} rounded-full h-3 transition-all" style="width: ${Math.min(d.percentage, 100)}%"></div>
                            <!-- Ideal range markers -->
                            <div class="absolute top-0 h-3 border-l-2 border-dashed border-gray-500 opacity-50" style="left: ${id.min}%"></div>
                            <div class="absolute top-0 h-3 border-l-2 border-dashed border-gray-500 opacity-50" style="left: ${id.max}%"></div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            // Top anchors per category
            html += '<div class="grid grid-cols-2 gap-4">';
            cats.forEach(cat => {
                const d = dist[cat] || {};
                const col = catColors[cat];
                const topAnchors = d.top_anchors || [];
                if (topAnchors.length === 0) return;

                html += `
                    <div class="bg-gray-900 border ${col.border} rounded-xl p-4">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-2.5 h-2.5 rounded ${col.bg}"></div>
                            <h4 class="text-sm text-white font-semibold">${catLabels[cat]}</h4>
                            <span class="text-[10px] ${col.text}">${d.percentage}%</span>
                        </div>
                        <div class="space-y-1">
                            ${topAnchors.map(a => `
                                <div class="flex items-center justify-between text-xs">
                                    <span class="text-gray-300 truncate flex-1 mr-2">"${a.anchor}"</span>
                                    <span class="text-gray-500 flex-shrink-0">${a.backlinks} links</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            return html;
        }

                // Stats row
                const high = prospects.filter(d => d.rank >= 60).length;
                const mid = prospects.filter(d => d.rank >= 40 && d.rank < 60).length;
                const std = prospects.filter(d => d.rank < 40).length;

                contentArea.innerHTML = `
                    <div class="max-w-6xl mx-auto">
                        <div class="mb-6">
                            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                                <i data-lucide="compass" class="w-6 h-6 text-blue-400"></i>
                                Link Prospects
                            </h2>
                            <p class="text-sm text-gray-400 mt-1">${currentClient.name} — Outreach opportunities from competitor backlink analysis</p>
                        </div>

                        <div class="grid grid-cols-3 gap-4 mb-6">
                            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
                                <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">High Quality (DR 60+)</p>
                                <p class="text-2xl font-bold text-emerald-400">${high}</p>
                            </div>
                            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
                                <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Medium (DR 40-59)</p>
                                <p class="text-2xl font-bold text-amber-400">${mid}</p>
                            </div>
                            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
                                <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Standard (DR 20-39)</p>
                                <p class="text-2xl font-bold text-gray-400">${std}</p>

                        </div>

                        ${tableHtml}
                    </div>`;
                lucide.createIcons();

                contentArea.innerHTML = `
                    <div class="bg-gray-900 border border-red-900/50 rounded-xl p-8 text-center max-w-2xl mx-auto mt-8">
                        <i data-lucide="alert-triangle" class="w-12 h-12 text-red-400 mx-auto mb-4"></i>
                        <h3 class="text-lg font-semibold text-white mb-2">Failed to load prospects</h3>

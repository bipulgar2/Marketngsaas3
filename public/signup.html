<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SEO Agency Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: { 900: '#111827', 950: '#0B0F19' },
                        violet: { 500: '#8B5CF6', 600: '#7C3AED' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-950 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-8">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
            <div class="text-center mb-8">
                <h1 id="signupTitle" class="text-2xl font-bold text-white mb-2">Create Account</h1>
                <p id="signupSubtitle" class="text-gray-400">Join SEO Agency Platform</p>
            </div>

            <!-- Invite badge (hidden by default) -->
            <div id="inviteBadge" class="hidden mb-6 bg-violet-600/10 border border-violet-500/30 rounded-lg px-4 py-3 text-center">
                <p class="text-violet-300 text-sm font-medium">🎉 You've been invited to join a team!</p>
                <p id="inviteRoleLabel" class="text-violet-400/70 text-xs mt-1"></p>
            </div>

            <form id="signupForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Full Name</label>
                    <input type="text" id="fullName" name="full_name"
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-violet-500 focus:outline-none"
                        placeholder="John Doe">
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-violet-500 focus:outline-none"
                        placeholder="you@example.com">
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">Password</label>
                    <input type="password" id="password" name="password" required minlength="6"
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-violet-500 focus:outline-none"
                        placeholder="••••••••">
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-medium py-3 rounded-lg transition-all">
                    Create Account
                </button>

                <div id="errorMessage" class="text-red-400 text-sm text-center hidden"></div>
                <div id="successMessage" class="text-emerald-400 text-sm text-center hidden"></div>
            </form>

            <p class="text-center text-gray-400 mt-6">
                Already have an account? <a href="/login.html" class="text-violet-400 hover:text-violet-300">Sign in</a>
            </p>
        </div>
    </div>

    <script>
        // Check for invite token in URL
        const urlParams = new URLSearchParams(window.location.search);
        const inviteToken = urlParams.get('invite');

        if (inviteToken) {
            // Show invite badge and update UI
            document.getElementById('inviteBadge').classList.remove('hidden');
            document.getElementById('signupTitle').textContent = 'Join Your Team';
            document.getElementById('signupSubtitle').textContent = 'Create your account to get started';
            document.getElementById('submitBtn').textContent = 'Join Team';

            // If email is in the URL too, pre-fill it
            const inviteEmail = urlParams.get('email');
            if (inviteEmail) {
                document.getElementById('email').value = inviteEmail;
            }

            // If role is in the URL, show it
            const inviteRole = urlParams.get('role');
            if (inviteRole) {
                const roleNames = {
                    'campaign_manager': 'Campaign Manager',
                    'content_strategist': 'Content Strategist',
                    'content_creator': 'Content Creator',
                    'optimization_specialist': 'Optimization Specialist',
                    'link_builder': 'Link Builder',
                    'reporting_manager': 'Reporting Manager',
                    'viewer': 'Client'
                };
                document.getElementById('inviteRoleLabel').textContent = `Role: ${roleNames[inviteRole] || inviteRole}`;
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            try {
                const payload = { email, password, full_name: fullName };

                // Include invite token if present
                if (inviteToken) {
                    payload.invite_token = inviteToken;
                }

                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    successDiv.textContent = data.message || 'Account created! Redirecting to login...';
                    successDiv.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Signup failed');
                }
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = inviteToken ? 'Join Team' : 'Create Account';
            }
        });
    </script>
</body>

</html>

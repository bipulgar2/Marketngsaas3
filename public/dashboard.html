        async function loadTasksContent() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="flex items-center justify-center h-full text-gray-500">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin mr-2"></i> Loading tasks...
                </div>`;
            lucide.createIcons();

            try {
                let url = '/api/tasks';
                if (currentClient && currentClient.id) {
                    url += `?campaign_id=${currentClient.id}`;
                }

                const [tasksRes, teamRes] = await Promise.all([
                    fetch(url),
                    fetch('/api/team')
                ]);
                const tasksData = await tasksRes.json();
                const teamData = await teamRes.json();
                
                currentLoadedTasks = tasksData.tasks || [];
                window.teamMembers = teamData.members || [];
                window.renderTasksTable();

            } catch (error) {
                contentArea.innerHTML = `<div class="text-red-400 p-8 text-center">Error loading tasks: ${error.message}</div>`;
                lucide.createIcons();
            }
        }


        async function updateTaskStatus(taskId, newStatus) {
            try {
                const res = await fetch(`/api/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || 'Failed to update status on server');
                }

                // Update local state and trigger re-render
                const taskIndex = currentLoadedTasks.findIndex(t => t.id === taskId);
                if (taskIndex !== -1) {
                    currentLoadedTasks[taskIndex].status = newStatus;
                }
                window.renderTasksTable();

            } catch (e) {
                console.error(e);
                alert('Task update failed: ' + e.message);
                window.renderTasksTable();
            }
        }

        async function renderSiteArchitecturePlanner() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '<div class="flex items-center justify-center p-12 text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mr-2"></i> Loading Architecture Planner...</div>';
            lucide.createIcons();
            
            try {
                const response = await fetch(`/api/site-architecture?campaign_id=${currentClient.id}`);
                const data = await response.json();
                let architecture = data.architecture || null;
                
                let treeData = architecture ? architecture.nodes : null;
                let selectedNodes = new Set();
                
                const renderTree = () => {
                    if (!treeData || treeData.length === 0) {
                        contentArea.innerHTML = `
                            <div class="mb-4">
                                <button onclick="renderAuditDetail()" class="text-gray-400 hover:text-white text-sm flex items-center gap-1">
                                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Audit
                                </button>
                            </div>
                            <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center max-w-2xl mx-auto mt-12 shadow-xl">
                                <div class="w-16 h-16 bg-violet-900/30 rounded-full flex items-center justify-center mx-auto mb-6 border border-violet-500/20">
                                    <i data-lucide="network" class="w-8 h-8 text-violet-400"></i>
                                </div>
                                <h3 class="text-2xl font-bold text-white mb-3">Generate Site Architecture</h3>
                                <p class="text-gray-400 mb-8">Create a complete, deeply nested, SEO-optimized page hierarchy tailored to your business model. This will give your site a structured backbone to build Content Strategy upon.</p>
                                
                                <div class="space-y-5 text-left max-w-sm mx-auto p-5 bg-gray-800/40 border border-gray-700/50 rounded-xl">
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Business Type Template</label>
                                        <select id="archBusinessType" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white text-sm focus:border-violet-500 focus:ring-1 focus:ring-violet-500 outline-none">
                                            <option value="saas">SaaS</option>
                                            <option value="e-commerce">E-commerce</option>
                                            <option value="local business">Local Business</option>
                                            <option value="blog">Blog / Publisher</option>
                                            <option value="agency">Agency / B2B Services</option>
                                        </select>
                                    </div>
                                    <button id="generateArchBtn" class="w-full bg-violet-600 hover:bg-violet-500 text-white px-4 py-3 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-colors shadow-lg shadow-violet-600/20 mt-2">
                                        <i data-lucide="sparkles" class="w-4 h-4"></i> Generate Architecture Tree
                                    </button>
                                </div>
                            </div>
                        `;
                        lucide.createIcons();
                        
                        document.getElementById('generateArchBtn')?.addEventListener('click', async (e) => {
                            const btn = e.currentTarget;
                            const type = document.getElementById('archBusinessType').value;
                            btn.disabled = true;
                            btn.classList.add('opacity-50', 'cursor-not-allowed');
                            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Analyzing & Generating...';
                            
                            try {
                                const bcRes = await fetch(`/api/campaigns/${currentClient.id}/brand-config`);
                                const bcData = await bcRes.json();
                                const brandConfig = bcData.brand_config || {};
                                
                                const req = await fetch('/api/generate-site-architecture', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({
                                        business_type: type,
                                        domain: currentClient.domain,
                                        brand_config: brandConfig
                                    })
                                });
                                const resData = await req.json();
                                if(!resData.success) throw new Error(resData.error);
                                
                                await fetch('/api/site-architecture', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({
                                        campaign_id: currentClient.id,
                                        architecture: resData.architecture
                                    })
                                });
                                
                                architecture = resData.architecture;
                                treeData = architecture.nodes;
                                renderTree();
                            } catch(err) {
                                alert("Generation Failed: " + err.message);
                                btn.disabled = false;
                                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                                btn.innerHTML = '<i data-lucide="sparkles" class="w-4 h-4"></i> Generate Architecture Tree';
                            }
                        });
                        return;
                    }
                    
                    // Build nested structure map
                    const rootNodes = treeData.filter(n => !n.parent_id);
                    const nodeMap = {};
                    treeData.forEach(n => {
                        n.children = [];
                        nodeMap[n.id] = n;
                    });
                    treeData.forEach(n => {
                        if (n.parent_id && nodeMap[n.parent_id]) {
                            nodeMap[n.parent_id].children.push(n);
                        }
                    });
                    Object.values(nodeMap).forEach(n => {
                        n.children.sort((a,b) => (a.order || 0) - (b.order || 0));
                    });
                    
                    const renderNode = (node, depth=0) => {
                        const isFolder = node.type === 'folder';
                        const icon = isFolder ? 'folder' : 'file-text';
                        const iconColor = isFolder ? 'text-emerald-400' : 'text-gray-400';
                        const checkedMsg = selectedNodes.has(node.id) ? 'checked' : '';
                        
                        let html = `
                            <div class="flex items-center gap-3 py-2.5 px-3 hover:bg-gray-800/60 rounded-lg group border border-transparent hover:border-gray-700/50 transition-colors" style="margin-left: ${depth * 32}px">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" data-id="${node.id}" class="arch-checkbox w-4 h-4 rounded border-gray-600 bg-gray-700 text-violet-600 focus:ring-violet-600 focus:ring-offset-gray-900 cursor-pointer" ${checkedMsg}>
                                    <i data-lucide="${icon}" class="w-4 h-4 ${iconColor}"></i>
                                </div>
                                <div class="flex-1 min-w-0 pr-4 flex items-center justify-between">
                                    <div class="flex-1 min-w-0 flex items-center gap-2">
                                        <span class="text-sm font-medium ${isFolder ? 'text-white' : 'text-gray-300'} truncate">${node.name}</span>
                                        ${node.status === 'existing' ? `<span class="align-middle inline-flex items-center text-[9px] font-bold uppercase tracking-wider bg-emerald-900/30 text-emerald-400 px-1.5 py-0.5 rounded border border-emerald-500/20"><i data-lucide="check" class="w-3 h-3 mr-0.5"></i>Existing</span>` : ''}
                                        ${node.status === 'recommended' ? `<span class="align-middle inline-flex items-center text-[9px] font-bold uppercase tracking-wider bg-fuchsia-900/30 text-fuchsia-400 px-1.5 py-0.5 rounded border border-fuchsia-500/20"><i data-lucide="sparkles" class="w-3 h-3 mr-0.5"></i>Recommended</span>` : ''}
                                        ${node.keyword ? `<span class="align-middle inline-flex items-center text-[10px] bg-indigo-900/30 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-500/20 truncate max-w-[150px]"><i data-lucide="key" class="w-3 h-3 mr-1"></i>${node.keyword}</span>` : ''}
                                    </div>
                                    <div class="text-[11px] text-gray-500 font-mono text-right truncate w-80">
                                        ${node.status === 'existing' 
                                            ? `<a href="${node.slug}" target="_blank" class="hover:text-emerald-400 hover:underline transition-colors" title="View page">${node.slug}</a>` 
                                            : `<span title="${node.slug}">${node.slug}</span>`}
                                    </div>
                                </div>
                                <div class="flex items-center gap-4 flex-shrink-0 w-24 justify-end">
                                    <div class="flex items-center gap-1.5 bg-gray-800/80 px-2 py-0.5 rounded text-[10px] border border-gray-700 font-mono">
                                        <span class="text-gray-500">PR:</span>
                                        <span class="text-emerald-400">${node.pr || 0}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        
                        if (node.children && node.children.length > 0) {
                            html += `<div class="ml-4 pl-2 border-l border-gray-800/60 my-0.5 relative before:content-[''] before:absolute before:left-0 before:top-4 before:w-2 before:border-t before:border-gray-800/60">`;
                            node.children.forEach(child => {
                                html += renderNode(child, depth + 1);
                            });
                            html += `</div>`;
                        }
                        return html;
                    };
                    
                    contentArea.innerHTML = `
                        <div class="flex flex-col h-full bg-[#0a0c10] border border-gray-800 rounded-xl overflow-hidden shadow-2xl">
                            <!-- Header -->
                            <div class="px-6 py-4 border-b border-gray-800 bg-gray-900/80 flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <button onclick="renderAuditDetail()" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-gray-800 transition-colors">
                                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                                    </button>
                                    <div>
                                        <div class="flex items-center gap-3">
                                            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                                <i data-lucide="network" class="w-5 h-5 text-violet-400"></i> Local Architecture
                                            </h3>
                                            <span class="text-[10px] uppercase tracking-wider bg-violet-500/10 text-violet-400 px-2 py-0.5 rounded-full font-semibold">${architecture.business_type}</span>
                                        </div>
                                        <p class="text-xs text-gray-400 mt-1 flex items-center gap-3">
                                            <span><strong class="text-gray-300">${treeData.length}</strong> nodes</span>
                                            <span class="w-1 h-1 rounded-full bg-gray-600"></span>
                                            <span><strong class="text-gray-300">3</strong> levels deep</span>
                                        </p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="text-sm font-medium"><span id="archSelectedCount" class="text-white bg-gray-800 px-2 py-0.5 rounded ml-1">0</span> <span class="text-gray-500 text-xs ml-1">selected</span></div>
                                    <button id="pushArchBtn" class="bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-violet-600/10" disabled>
                                        <i data-lucide="arrow-right-to-line" class="w-4 h-4"></i> Push to Content Strategy
                                    </button>
                                    <div class="w-px h-6 bg-gray-800 mx-1"></div>
                                    <button id="regenArchBtn" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-gray-800 transition-colors flex items-center gap-2 text-xs font-medium" title="Regenerate Architecture">
                                        <i data-lucide="refresh-cw" class="w-4 h-4"></i> Regenerate
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Tree Content -->
                            <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">
                                <div class="w-full max-w-[1400px] mx-auto">
                                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-inner">
                                        <div class="flex px-3 pb-2 mb-2 border-b border-gray-800/80 text-[10px] font-bold text-gray-500 uppercase tracking-wider">
                                            <div class="flex-1 pl-[52px]">Site Structure & Priority Keyword</div>
                                            <div class="w-80 text-right pr-4">URL Slug</div>
                                            <div class="w-24 text-right pr-2 text-emerald-500">PageRank</div>
                                        </div>
                                        <div class="space-y-0.5 pb-4">
                                            ${rootNodes.map(n => renderNode(n, 0)).join('')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    lucide.createIcons();
                    
                    const checkBoxes = contentArea.querySelectorAll('.arch-checkbox');
                    const pushBtn = document.getElementById('pushArchBtn');
                    const countSpan = document.getElementById('archSelectedCount');
                    
                    const updateSelection = () => {
                        selectedNodes.clear();
                        checkBoxes.forEach(cb => {
                            if(cb.checked) selectedNodes.add(cb.dataset.id);
                        });
                        countSpan.textContent = selectedNodes.size;
                        pushBtn.disabled = selectedNodes.size === 0;
                    };
                    
                    checkBoxes.forEach(cb => cb.addEventListener('change', updateSelection));
                    if(selectedNodes.size > 0) updateSelection();
                    
                    document.getElementById('regenArchBtn')?.addEventListener('click', () => {
                        if(confirm('Are you sure you want to regenerate the architecture? This will overwrite the current plan.')) {
                            treeData = null;
                            architecture = null;
                            renderTree();

                        if(selectedNodes.size === 0) return;
                        pushBtn.disabled = true;
                        pushBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Pushing...';
                        
                        const nodesToPush = treeData.filter(n => selectedNodes.has(n.id));

                            const req = await fetch('/api/site-architecture/push-to-content', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},

        function renderMarkdown(text) {
            if (!text) return '';
            let html = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/^### (.*$)/gm, '<h5 class="font-bold text-gray-200 mt-3 mb-1">$1</h5>')
                .replace(/^## (.*$)/gm, '<h4 class="font-bold text-white mt-4 mb-2">$1</h4>')
                .replace(/^\s*[\*\-]\s+(.*$)/gm, '<li class="ml-4">$1</li>')
                .replace(/\n/g, '<br>');
            if (html.includes('<li')) {
                html = html.replace(/((?:<li.*?>.*?<\/li>\s*)+)/g, '<ul class="list-disc list-inside space-y-1 text-gray-300">$1</ul>');
            }
            return html;
        }

        // =====================================================================
        // OPPORTUNITY SCORING — Uses GSC data to find quick wins
        // =====================================================================
        async function renderOpportunityScoring() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `<div class="flex items-center justify-center h-32 text-gray-500">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin mr-2"></i> Analyzing keyword opportunities from GSC...
            </div>`;
            lucide.createIcons();

            // Need GSC property
            const settings = currentClient.settings || {};
            const gscProp = settings.gsc_property;

            if (!gscProp) {
                contentArea.innerHTML = `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center">
                        <i data-lucide="alert-circle" class="w-12 h-12 text-amber-500 mx-auto mb-4"></i>
                        <h3 class="text-lg font-semibold text-white mb-2">GSC Not Connected</h3>
                        <p class="text-gray-400">Connect Google Search Console in Settings to unlock opportunity scoring.</p>
                        <button onclick="switchSideTab('google'); switchTopTab('client-settings');" class="mt-4 px-4 py-2 bg-violet-600 hover:bg-violet-500 text-white rounded-lg text-sm">Go to Settings</button>
                    </div>`;
                lucide.createIcons();
                return;
            }

            try {
                const response = await fetch('/api/google-metrics', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gsc_property: gscProp, ga4_property: null, duration: '3m' })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                const queries = (data.gsc && (data.gsc.allQueries || data.gsc.queries)) || [];
                
                if (queries.length === 0) {
                    contentArea.innerHTML = '<div class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center"><p class="text-gray-400">No GSC query data available.</p></div>';
                    return;
                }

                // Score each keyword
                const scored = queries.map(q => {
                    const clicks = q.clicks || 0;
                    const impr = q.impressions || 0;
                    const ctr = q.ctr || 0;
                    const pos = q.position || 0;
                    
                    // Quick Win Score (0-100): High impressions + low CTR + position 4-20
                    // = keywords you're already ranking for but not getting clicks
                    let quickWin = 0;
                    if (pos >= 4 && pos <= 20 && impr > 10) {
                        const posScore = pos <= 10 ? 40 : 25; // On page 1-2
                        const imprScore = Math.min(40, (impr / 100) * 40); // More impressions = better
                        const ctrPenalty = ctr > 0.05 ? -20 : 0; // Already getting clicks = less opportunity
                        quickWin = Math.round(Math.max(0, Math.min(100, posScore + imprScore + 20 + ctrPenalty)));
                    }
                    
                    // Growth Score (0-100): Position 11-50 with decent impressions
                    // = keywords worth pushing to page 1
                    let growth = 0;
                    if (pos > 10 && pos <= 50 && impr > 5) {
                        const distToPage1 = Math.max(0, pos - 10);
                        const effortScore = Math.max(0, 50 - distToPage1); // Closer to page 1 = easier
                        const imprScore = Math.min(30, (impr / 50) * 30);
                        growth = Math.round(Math.max(0, Math.min(100, effortScore + imprScore + 20)));
                    }

                    // Revenue Score (0-100): High clicks + good position
                    // = keywords already driving traffic
                    let revenue = 0;
                    if (clicks > 0) {
                        const clickScore = Math.min(50, (clicks / 50) * 50);
                        const posBonus = pos <= 5 ? 30 : pos <= 10 ? 20 : 10;
                        revenue = Math.round(Math.max(0, Math.min(100, clickScore + posBonus + 20)));
                    }

                    const bestScore = Math.max(quickWin, growth, revenue);
                    let bestType = 'none';
                    if (bestScore === quickWin && quickWin > 0) bestType = 'quick_win';
                    else if (bestScore === growth && growth > 0) bestType = 'growth';
                    else if (bestScore === revenue && revenue > 0) bestType = 'revenue';

                    return { ...q, quickWin, growth, revenue, bestScore, bestType };
                }).filter(q => q.bestScore > 0).sort((a, b) => b.bestScore - a.bestScore);

                // Category counts
                const quickWins = scored.filter(q => q.bestType === 'quick_win');
                const growthOps = scored.filter(q => q.bestType === 'growth');
                const revenueOps = scored.filter(q => q.bestType === 'revenue');
                const tracked = currentClient.tracked_keywords || [];

                const scoreBadge = (score) => {
                    if (score >= 70) return '<span class="px-1.5 py-0.5 rounded text-xs font-bold bg-emerald-900/40 text-emerald-400">' + score + '</span>';
                    if (score >= 40) return '<span class="px-1.5 py-0.5 rounded text-xs font-bold bg-amber-900/40 text-amber-400">' + score + '</span>';
                    if (score > 0) return '<span class="px-1.5 py-0.5 rounded text-xs font-bold bg-gray-700 text-gray-400">' + score + '</span>';
                    return '<span class="text-gray-600">—</span>';
                };

                const typeBadge = (type) => {
                    if (type === 'quick_win') return '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-orange-900/40 text-orange-400 border border-orange-800/50">⚡ Quick Win</span>';

                    if (type === 'revenue') return '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-900/40 text-emerald-400 border border-emerald-800/50">💰 Revenue</span>';

                            <div>
                                <h2 class="text-xl font-bold text-white flex items-center gap-2">

                                <p class="text-sm text-gray-400 mt-1">Keywords scored by opportunity type using your GSC data (last 3 months).</p>
                            </div>

                                <div class="text-[10px] text-gray-500 uppercase">Opportunities</div>
                            </div>
                            <div class="bg-gray-900 border border-orange-900/50 rounded-lg p-3 text-center">
                                <div class="text-2xl font-bold text-orange-400">${quickWins.length}</div>
                                <div class="text-[10px] text-orange-400/70 uppercase">⚡ Quick Wins</div>
                            </div>
                            <div class="bg-gray-900 border border-blue-900/50 rounded-lg p-3 text-center">
                                <div class="text-2xl font-bold text-blue-400">${growthOps.length}</div>
                                <div class="text-[10px] text-blue-400/70 uppercase">📈 Growth</div>
                            </div>
                            <div class="bg-gray-900 border border-emerald-900/50 rounded-lg p-3 text-center">
                                <div class="text-2xl font-bold text-emerald-400">${revenueOps.length}</div>
                                <div class="text-[10px] text-emerald-400/70 uppercase">💰 Revenue</div>
                            </div>
                        </div>

                        <!-- Filters -->
                        <div class="flex items-center gap-2 mb-3">

                            <button onclick="filterOpportunities('quick_win')" class="opp-filter-btn px-3 py-1.5 bg-gray-800 border border-gray-700 text-gray-400 rounded-lg text-xs font-medium hover:bg-gray-700 transition" data-filter="quick_win">⚡ Quick Wins (${quickWins.length})</button>
                            <button onclick="filterOpportunities('growth')" class="opp-filter-btn px-3 py-1.5 bg-gray-800 border border-gray-700 text-gray-400 rounded-lg text-xs font-medium hover:bg-gray-700 transition" data-filter="growth">📈 Growth (${growthOps.length})</button>
                            <button onclick="filterOpportunities('revenue')" class="opp-filter-btn px-3 py-1.5 bg-gray-800 border border-gray-700 text-gray-400 rounded-lg text-xs font-medium hover:bg-gray-700 transition" data-filter="revenue">💰 Revenue (${revenueOps.length})</button>

        async function generateTopicClusters() {
            const ta = document.getElementById('clusterKeywordsInput');
            const keywords = (ta?.value || '').split('\n').map(l => l.trim()).filter(Boolean);
            if (keywords.length < 3) { showToast('Enter at least 3 keywords', 'error'); return; }

        async function generateBrief() {
            const keyword = document.getElementById('briefKeywordInput')?.value?.trim();
            if (!keyword) { showToast('Enter a keyword', 'error'); return; }

            const funnel = document.getElementById('briefFunnelSelect')?.value || 'mofu';
            const btn = document.getElementById('briefGenBtn');
            const results = document.getElementById('briefResults');

            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Generating...';
            lucide.createIcons();
            results.innerHTML = '<div class="flex items-center justify-center h-24 text-gray-500"><i data-lucide="loader-2" class="w-5 h-5 animate-spin mr-2"></i>AI is crafting your content brief...</div>';
            lucide.createIcons();

            // Fetch brand config
            let brandConfig = {};
            try {
                const bcRes = await fetch(`/api/campaigns/${currentClient.id}/brand-config`);
                const bcData = await bcRes.json();
                brandConfig = bcData.brand_config || {};
            } catch(e) {}

            try {
                const res = await fetch('/api/generate-content-brief', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword, funnel_stage: funnel, brand_config: brandConfig })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                _lastBrief = data.brief;
                results.innerHTML = renderBriefDisplay(data.brief);
                lucide.createIcons();
            } catch (error) {
                console.error(error);
                results.innerHTML = '<div class="bg-red-900/20 border border-red-800 rounded-xl p-6 text-center"><span class="text-red-400">Error:</span> <span class="text-gray-400">' + error.message + '</span></div>';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="sparkles" class="w-4 h-4"></i> Generate Brief';
                lucide.createIcons();
            }
        }

        async function renderContentCalendar() {
            const contentArea = document.getElementById('contentArea');
            const hasClusters = _topicClustersData && _topicClustersData.length > 0;

        function changeCalMonth(delta) {
            _calendarMonth += delta;
            if (_calendarMonth > 11) { _calendarMonth = 0; _calendarYear++; }
            if (_calendarMonth < 0) { _calendarMonth = 11; _calendarYear--; }
            renderCalendarGrid();
        }

        function renderCalendarGrid() {
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            const label = document.getElementById('calMonthLabel');
            if (label) label.textContent = months[_calendarMonth] + ' ' + _calendarYear;

            const firstDay = new Date(_calendarYear, _calendarMonth, 1).getDay();
            const daysInMonth = new Date(_calendarYear, _calendarMonth + 1, 0).getDate();
            const today = new Date();

            const statusColors = {
                'planned': 'bg-gray-700 text-gray-300',
                'in-progress': 'bg-amber-900/40 text-amber-400',
                'review': 'bg-blue-900/40 text-blue-400',
                'published': 'bg-emerald-900/40 text-emerald-400'
            };

            let grid = '<div class="grid grid-cols-7 gap-px bg-gray-800 border border-gray-700 rounded-xl overflow-hidden">';
            // Day headers
            ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
                grid += '<div class="bg-gray-900 text-center text-[10px] text-gray-500 uppercase py-2 font-semibold">' + d + '</div>';
            });

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                grid += '<div class="bg-gray-900/50 min-h-[80px] p-1"></div>';
            }

            // Day cells
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = _calendarYear + '-' + String(_calendarMonth + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const isToday = today.getDate() === day && today.getMonth() === _calendarMonth && today.getFullYear() === _calendarYear;
                const dayItems = _calendarItems.filter(item => item.date === dateStr);

                grid += '<div class="bg-gray-900 min-h-[80px] p-1.5 ' + (isToday ? 'ring-1 ring-pink-500/50' : '') + '" ondrop="dropCalItem(event,\'' + dateStr + '\')" ondragover="event.preventDefault()">';
                grid += '<div class="text-[10px] font-semibold mb-1 ' + (isToday ? 'text-pink-400' : 'text-gray-500') + '">' + day + '</div>';

                dayItems.forEach(item => {
                    const isLink = item.type === 'link-building';
                    const sc = isLink ? 'bg-rose-900/40 text-rose-400 border border-rose-800/30' : (statusColors[item.status || 'planned'] || statusColors['planned']);
                    grid += '<div class="px-1.5 py-0.5 rounded text-[10px] mb-0.5 cursor-move truncate ' + sc + '" draggable="true" ondragstart="dragCalItem(event,' + _calendarItems.indexOf(item) + ')" title="' + (item.title || '').replace(/"/g, '&quot;') + (isLink && item.anchor ? ' | Anchor: ' + item.anchor : '') + '">' + (item.title || 'Untitled') + '</div>';
                });

                grid += '</div>';
            }

            // Fill remaining cells
            const totalCells = firstDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 0; i < remaining; i++) {
                grid += '<div class="bg-gray-900/50 min-h-[80px] p-1"></div>';
            }

            grid += '</div>';

            const gridEl = document.getElementById('calendarGrid');
            if (gridEl) gridEl.innerHTML = grid;

            // Backlog (unscheduled)
            const backlog = _calendarItems.filter(item => !item.date);
            const backlogEl = document.getElementById('calendarBacklog');
            if (backlogEl && backlog.length > 0) {
                backlogEl.innerHTML = `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
                        <h4 class="text-xs text-pink-400 uppercase tracking-wider font-semibold mb-2">Backlog (${backlog.length} unscheduled)</h4>
                        <div class="flex flex-wrap gap-2">
                            ${backlog.map((item, i) => {
                                const idx = _calendarItems.indexOf(item);
                                return '<div class="px-3 py-1.5 bg-gray-800 border border-gray-700 rounded-lg text-xs text-gray-300 cursor-move" draggable="true" ondragstart="dragCalItem(event,' + idx + ')">' + (item.title || 'Untitled') + ' <button onclick="removeCalItem(' + idx + ')" class="ml-1 text-gray-600 hover:text-red-400">×</button></div>';
                            }).join('')}
                        </div>
                    </div>
                `;
            } else if (backlogEl) {
                backlogEl.innerHTML = '';
            }

            lucide.createIcons();
        }

        function addCalendarItem() {
            const title = prompt('Content title:');
            if (!title) return;
            _calendarItems.push({ title, status: 'planned', date: null, funnel: 'mofu' });
            renderCalendarGrid();
            showToast('Item added to backlog', 'success');
        }

        function removeCalItem(idx) {
            _calendarItems.splice(idx, 1);
            renderCalendarGrid();
        }

        function dragCalItem(event, idx) {
            event.dataTransfer.setData('text/plain', idx);
        }

        function dropCalItem(event, dateStr) {
            event.preventDefault();
            const idx = parseInt(event.dataTransfer.getData('text/plain'));
            if (!isNaN(idx) && _calendarItems[idx]) {
                _calendarItems[idx].date = dateStr;
                renderCalendarGrid();
            }
        }

        function importClustersToCalendar() {

        async function generateGuestPosts() {
            const btn = document.getElementById('gpGenBtn');

            try {

        function renderGuestPostCards(topics) {
            if (!topics || topics.length === 0) return '<div class="text-gray-500 text-center py-8">No topics generated.</div>';

            const diffBadge = (d) => {
                if (d === 'easy') return '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-900/40 text-emerald-400">Easy</span>';
                if (d === 'medium') return '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-900/40 text-amber-400">Medium</span>';
                return '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-900/40 text-red-400">Hard</span>';
            };

            const funnelBadge = (s) => {
                if (s === 'tofu') return '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-red-900/30 text-red-400">ToFu</span>';
                if (s === 'mofu') return '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-900/30 text-amber-400">MoFu</span>';
                return '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-900/30 text-emerald-400">BoFu</span>';
            };

            // Stats
            const easy = topics.filter(t => t.difficulty === 'easy').length;
            const medium = topics.filter(t => t.difficulty === 'medium').length;
            const hard = topics.filter(t => t.difficulty === 'hard').length;

            let html = `
                <div class="grid grid-cols-3 gap-3 mb-4">
                    <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-center">
                        <div class="text-2xl font-bold text-white">${topics.length}</div>

                    </div>
                    <div class="bg-gray-900 border border-gray-800 rounded-lg p-3 text-center">

                            <span class="text-gray-600 mx-1">/</span>
                            <span class="text-red-400">${hard}</span>
                        </div>
                        <div class="text-[10px] text-gray-500 uppercase">Med / Hard</div>
                    </div>
                </div>
            `;

            html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
            topics.forEach((topic, i) => {
                const sites = (topic.example_sites || []).map(s => '<span class="text-blue-400 text-[11px]">' + s + '</span>').join(', ');
                html += `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 hover:border-rose-900/50 transition">
                        <div class="flex items-start justify-between mb-2">
                            <h3 class="text-sm text-white font-semibold flex-1 pr-2">${topic.title || 'Untitled'}</h3>
                            <div class="flex items-center gap-1.5 flex-shrink-0">
                                ${funnelBadge(topic.funnel_stage)}
                                ${diffBadge(topic.difficulty)}
                            </div>
                        </div>
                        <div class="text-xs text-gray-400 mb-3 italic">"${topic.pitch_angle || ''}"</div>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <div class="text-[10px] text-gray-500 uppercase mb-0.5">Target Sites</div>
                                <div class="text-gray-300">${topic.target_site_type || ''}</div>
                                ${sites ? '<div class="mt-0.5">' + sites + '</div>' : ''}
                            </div>
                            <div>
                                <div class="text-[10px] text-gray-500 uppercase mb-0.5">Content Type</div>
                                <div class="text-gray-300">${topic.content_type || 'Article'}</div>
                            </div>
                            <div>
                                <div class="text-[10px] text-gray-500 uppercase mb-0.5">Anchor Text</div>
                                <div class="text-rose-400 font-medium">"${topic.anchor_text || ''}"</div>
                            </div>

                                <div class="text-gray-300">${topic.target_page || 'Homepage'}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        async function saveBrandConfig() {
            if (!currentClient) return;
            
            const btn = document.getElementById('saveBrandConfigBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Saving...';
                lucide.createIcons();
            }

            const config = {
                business_name: document.getElementById('bc_business_name')?.value || '',
                industry: document.getElementById('bc_industry')?.value || '',
                usp: document.getElementById('bc_usp')?.value || '',
                voice_style: document.getElementById('bc_voice_style')?.value || '',
                perspective: document.getElementById('bc_perspective')?.value || '',
                tone_notes: document.getElementById('bc_tone_notes')?.value || '',
                primary_audience: document.getElementById('bc_primary_audience')?.value || '',
                secondary_audience: document.getElementById('bc_secondary_audience')?.value || '',
                geo_focus: document.getElementById('bc_geo_focus')?.value || '',
                pain_points: document.getElementById('bc_pain_points')?.value || '',
                tofu_description: document.getElementById('bc_tofu_description')?.value || '',
                mofu_description: document.getElementById('bc_mofu_description')?.value || '',
                bofu_description: document.getElementById('bc_bofu_description')?.value || '',
                journey_notes: document.getElementById('bc_journey_notes')?.value || '',
                aspiration: document.getElementById('bc_aspiration')?.value || '',
                competitors: document.getElementById('bc_competitors')?.value || '',
                content_length: document.getElementById('bc_content_length')?.value || '',
                linking_strategy: document.getElementById('bc_linking_strategy')?.value || '',
                ai_notes: document.getElementById('bc_ai_notes')?.value || ''
            };

            try {
                const res = await fetch(`/api/campaigns/${currentClient.id}/brand-config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brand_config: config })
                });

                if (res.ok) {
                    const data = await res.json();
                    // Update local client object
                    currentClient.brand_config = data.brand_config;
                    showToast('Brand configuration saved!', 'success');
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Save Configuration';
                        lucide.createIcons();
                    }
                } else {
                    throw new Error('Failed to save');
                }
            } catch (error) {
                console.error(error);
                showToast('Error saving brand config', 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Save Configuration';
                    lucide.createIcons();
                }
            }
        }

        // --- All Links Render ---
        async function renderAllLinks() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `<div class="flex items-center justify-center h-32 text-gray-500">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin mr-2"></i> Loading all links...
            </div>`;
            lucide.createIcons();

            if (!currentClient || !currentClient.id) {
                contentArea.innerHTML = `<div class="text-gray-400 text-center p-8">Select a campaign first.</div>`;
                return;
            }

            try {
                const res = await fetch(`/api/audit-links?project_id=${currentClient.id}`);
                const data = await res.json();
                const pages = data.pages || [];

                if (pages.length === 0) {
                    contentArea.innerHTML = `
                        <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center">
                            <i data-lucide="link" class="w-12 h-12 text-gray-600 mx-auto mb-4"></i>
                            <h3 class="text-lg font-semibold text-white mb-2">No Links Found</h3>
                            <p class="text-gray-400">Run a Site Audit first to automatically discover all links on the website.</p>
                        </div>`;
                    lucide.createIcons();
                    return;
                }

                // Gather existing page URLs to show status
                const existingUrls = {};
                contentProjectPages.forEach(p => {
                    let funnel = 'Added';
                    if ((p.page_type||'').toLowerCase() === 'product') funnel = 'BoFu';
                    else if ((p.funnel_stage||'').toLowerCase() === 'mofu') funnel = 'MoFu';
                    else if ((p.funnel_stage||'').toLowerCase() === 'tofu') funnel = 'ToFu';
                    existingUrls[p.url] = funnel;
                });

                let rows = pages.map(p => {
                    const url = p.url || '';
                    const title = p.title || p.meta?.title || url.split('/').pop() || 'Untitled';
                    
                    const funnelStatus = existingUrls[url];
                    const statusBadge = funnelStatus
                        ? `<span class="px-2 py-0.5 bg-green-900/30 border border-green-800 text-green-400 rounded text-xs">Added (${funnelStatus})</span>`
                        : '<span class="px-2 py-0.5 bg-gray-800 border border-gray-700 text-gray-400 rounded text-xs">New</span>';

                    return `
                        <tr class="hover:bg-gray-800/30 transition-colors border-b border-gray-800/50">
                            <td class="px-6 py-4 truncate max-w-xs text-sm font-medium text-white">${title}</td>
                            <td class="px-6 py-4 truncate max-w-md text-xs text-blue-400"><a href="${url}" target="_blank" class="hover:underline">${url}</a></td>
                            <td class="px-6 py-4 text-center">${statusBadge}</td>
                            <td class="px-6 py-4 text-right">
                                <select onchange="assignPageType('${url}', this.value, '${btoa(encodeURIComponent(JSON.stringify(p)))}')" class="bg-gray-800 border border-gray-700 text-xs rounded px-3 py-1.5 text-white focus:ring-1 focus:ring-violet-500 focus:border-violet-500 outline-none cursor-pointer">
                                    <option value="">Assign To...</option>
                                    <option value="bofu">BoFu (Product)</option>
                                    <option value="mofu">MoFu (Category)</option>
                                    <option value="tofu">ToFu (Blog)</option>
                                </select>
                            </td>
                        </tr>
                    `;
                }).join('');

                contentArea.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h2 class="text-xl font-semibold text-white">All Discovered Links</h2>
                            <p class="text-sm text-gray-400 mt-1">Found ${pages.length} pages in the latest site audit. Assign them to funnels manually.</p>
                        </div>
                    </div>
                    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-sm">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-800 border-b border-gray-700">
                                        <th class="px-6 py-4 text-xs font-semibold text-gray-300 uppercase tracking-wider">Page Title</th>
                                        <th class="px-6 py-4 text-xs font-semibold text-gray-300 uppercase tracking-wider">URL</th>
                                        <th class="px-6 py-4 text-xs font-semibold text-gray-300 uppercase tracking-wider text-center">Status</th>
                                        <th class="px-6 py-4 text-xs font-semibold text-gray-300 uppercase tracking-wider text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                lucide.createIcons();

            } catch (err) {
                console.error("Error loading links:", err);
                contentArea.innerHTML = `<div class="text-red-400 p-4 bg-red-900/20 border border-red-500/50 rounded-lg">Error loading links.</div>`;
            }

        async function assignPageType(url, pageType, encoding) {
            if (!pageType) return;
            if (!currentClient || !currentClient.id) return;
            
            try {
                const parsedData = JSON.parse(decodeURIComponent(atob(encoding)));
                let techData = {
                    title: parsedData.title || '',
                    meta_description: parsedData.description || parsedData.meta?.description || '',
                    word_count: parsedData.word_count || 0,
                    body_content: ""
                };

                const res = await fetch('/api/assign-page-type', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: currentClient.id,
                        url: url,
                        page_type: pageType,
                        tech_audit_data: techData
                    })
                });
                
                const response = await res.json();
                if (response.success) {
                    // Show a quick toast or let UI just refresh natively
                    const toast = document.createElement('div');
                    toast.className = 'fixed bottom-4 right-4 bg-green-600 text-white px-6 py-3 rounded shadow-lg z-50 text-sm font-medium';
                    toast.innerText = 'Page assigned to ' + pageType.toUpperCase();
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 3000);
                    
                    // Reload data in background to update tags
                    await loadContentPages();
                    renderAllLinks();
                } else {
                    alert('Error: ' + response.error);
                }
            } catch (e) {
                console.error(e);
                alert('Something went wrong assigning page type');
            }
        }

        // --- BoFu (Products) Render ---
        function renderBoFu() {

            if (products.length === 0) {
                contentArea.innerHTML = `

                        <i data-lucide="package" class="w-12 h-12 text-gray-600 mx-auto mb-4"></i>
                        <h3 class="text-lg font-semibold text-white mb-2">No Product Pages Found</h3>
                        <p class="text-gray-400">Product pages need to be classified first via the SEO System's URL Classification tab.</p>
                    </div>`;
                return;
            }

            let rows = products.map(p => {
                const data = p.tech_audit_data || {};
                const contentPreview = p.content ? p.content.substring(0, 50) + '...' : '';

                if (isBadTitle) {
                    const slug = p.url.split('/').filter(s => s).pop() || 'product';
                    displayTitle = slug.replace(/-/g, ' ').replace(/_/g, ' ').split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                }
                return `
                    <tr class="hover:bg-gray-800/30 transition-colors border-b border-gray-800/50">
                        <td class="px-6 py-4 truncate max-w-xs text-sm font-medium text-white capitalize" title="${displayTitle}">${displayTitle}</td>
                        <td class="px-6 py-4 truncate max-w-xs text-xs text-blue-400" title="${p.url}"><a href="${p.url}" target="_blank" class="hover:underline">${p.url}</a></td>

                            ? '<span class="px-2 py-1 bg-green-900/30 border border-green-800 rounded text-green-400 text-xs hover:bg-green-900/50">View Content</span>'

                                <option value="Generate Content" ${p.product_action === 'Generate Content' ? 'selected' : ''}>Generate Content</option>
                                <option value="Generate MoFu" ${p.product_action === 'Generate MoFu' ? 'selected' : ''}>Generate MoFu</option>
                            </select>
                        </td>
                        <td class="px-6 py-4 text-xs text-gray-400 cursor-pointer hover:text-white" onclick="contentShowModalContent('${p.id}', 'new')">
                            ${contentPreview ? '<span class="px-2 py-1 bg-green-900/30 border border-green-800 rounded text-green-400 text-xs whitespace-nowrap">View</span>' : '<span class="text-gray-600">Generate First</span>'}

                            ${data.meta_description || '-'}

                `;
            }).join('');

            contentArea.innerHTML = `
                <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-900/50 text-xs uppercase text-gray-400 border-b border-gray-800">

                                <th class="px-6 py-3 text-left font-medium min-w-[300px]">Product</th>

        // --- MoFu Render ---
        function renderMoFu() {
            const contentArea = document.getElementById('contentArea');
            const topics = contentProjectPages.filter(p => (p.page_type || '').toLowerCase() === 'topic' && (p.funnel_stage || '').toLowerCase() === 'mofu');

            if (topics.length === 0) {
                contentArea.innerHTML = `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center">
                        <i data-lucide="layers" class="w-12 h-12 text-gray-600 mx-auto mb-4"></i>
                        <h3 class="text-lg font-semibold text-white mb-2">No MoFu Topics</h3>
                        <p class="text-gray-400">Go to BoFu (Products) and select "Generate MoFu" to create silo topics.</p>
                    </div>`;
                return;
            }

            // Group by source page
            const grouped = {};
            topics.forEach(t => {
                const sourceId = t.source_page_id || 'unknown';
                if (!grouped[sourceId]) grouped[sourceId] = [];
                grouped[sourceId].push(t);
            });

            let htmlContent = '';
            for (const [sourceId, groupTopics] of Object.entries(grouped)) {
                const sourcePage = contentProjectPages.find(p => p.id === sourceId);
                const sourceTitle = sourcePage ? (sourcePage.tech_audit_data?.title || sourcePage.url) : 'Unknown Source';

                htmlContent += `
                    <tr class="bg-gray-800/50 border-b border-gray-800">
                        <td colspan="9" class="px-6 py-3 text-xs font-bold text-gray-400 uppercase tracking-wider">

        // --- Action Handlers ---
        async function handleBoFuAction(pageId, action, selectElement) {
            if (action === 'Idle') return;
            try {
                if (action === 'Generate Content' || action === 'Generate MoFu') {
                    contentShowLoading('Processing... this may take more than 2 minutes');
                } else {
                    contentShowLoading(`Processing ${action}...`);
                }

                const apiAction = action === 'Generate Content' ? 'generate_content' : 'generate_mofu';

                const res = await fetch('/api/batch-update-pages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_ids: [pageId], action: apiAction })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Unknown error');

                // Poll for completion
                const pollInterval = setInterval(async () => {
                    try {
                        const statusRes = await fetch(`/api/get-page-status?page_id=${pageId}`);
                        if (statusRes.ok) {
                            const statusData = await statusRes.json();
                            if (statusData.product_action && !statusData.product_action.includes('Processing')) {
                                clearInterval(pollInterval);
                                contentHideLoading();
                                await loadContentTab();
                                alert(`Success! ${action} completed.`);
                            }
                        }
                    } catch (e) { console.error('Polling error:', e); }
                }, 3000);

            } catch (e) {
                console.error(e);
                alert('Error: ' + e.message);
                contentHideLoading();
            } finally {
                if (selectElement) selectElement.value = 'Idle';
            }
        }

        async function handleMoFuAction(pageId, action) {
            if (action === 'Idle') return;

            if (action === 'PushWebflow') {
                currentArticlePageId = pageId;
                contentOpenWebflowModal();
                return;
            }
            if (action === 'PushWordpress') {
                currentArticlePageId = pageId;
                contentOpenWordpressModal();
                return;
            }
            if (action === 'CopyHTML') {
                await contentCopyHTML(pageId);
                return;
            }
            if (action === 'Generate Image') {
                await contentGenerateImage(pageId);
                return;
            }

            if (action === 'Conduct Research') {
                contentShowLoading('Conducting Deep Research... This may take up to 2 minutes per topic.');
            } else {
                contentShowLoading(`Processing ${action}... this may take more than 2 minutes`);
            }

            try {
                const apiAction = action === 'Generate Content' ? 'generate_content' :
                    action === 'Conduct Research' ? 'conduct_research' :
                    action === 'Generate ToFu' ? 'generate_tofu' : 'idle';

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 600000);

                const res = await fetch('/api/batch-update-pages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_ids: [pageId], action: apiAction }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(`API Error: ${res.status} - ${err}`);
                }

                // Poll for completion
                const pollInterval = setInterval(async () => {
                    try {
                        const statusRes = await fetch(`/api/get-page-status?page_id=${pageId}`);
                        if (statusRes.ok) {
                            const statusData = await statusRes.json();
                            if (statusData.product_action && !statusData.product_action.includes('Processing')) {
                                clearInterval(pollInterval);
                                contentHideLoading();
                                await loadContentTab();
                            }
                        }
                    } catch (e) { console.error('Polling error:', e); }
                }, 3000);

            } catch (e) {
                console.error(e);
                if (e.name === 'AbortError') {
                    alert('Action timed out. It may still be running in background. Refresh in a few minutes.');
                } else {
                    alert('Action failed: ' + e.message);
                }
                contentHideLoading();
            }
        }

        // --- Content Helper Functions ---
        async function contentDeletePage(id) {
            if (!confirm('Are you sure you want to delete this item? This cannot be undone.')) return;
            try {
                contentShowLoading('Deleting item...');
                const res = await fetch(`/api/delete-page?page_id=${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
                alert('Item deleted successfully.');
                await loadContentTab();
            } catch (e) {
                console.error(e);
                alert('Error deleting item: ' + e.message);
            } finally {
                contentHideLoading();
            }
        }

        async function contentCopyHTML(pageId) {
            contentShowLoading('Preparing HTML...');
            try {
                const res = await fetch('/api/get-html-content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_id: pageId })
                });
                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();
                await navigator.clipboard.writeText(data.html);
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-[9999] animate-pulse';
                toast.innerHTML = '<strong>✓ HTML Copied!</strong> Paste into WordPress or any CMS.';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            } catch (e) {
                console.error(e);
                alert('Error copying HTML: ' + e.message);
            } finally {
                contentHideLoading();
            }
        }

        function contentShowResearchData(pageId) {
            const p = contentProjectPages.find(page => page.id === pageId);
            if (!p || !p.research_data) {
                alert('No research data available for this topic.');
                return;
            }

            const researchData = p.research_data;
            function formatResearchValue(val) {
                if (!val) return 'N/A';
                if (typeof val === 'string') return renderMarkdown(val);
                if (Array.isArray(val)) {
                    return `<ul class="list-disc list-inside space-y-1 ml-2">
                        ${val.map(item => `<li>${formatResearchValue(item)}</li>`).join('')}
                    </ul>`;
                }
                if (typeof val === 'object') {
                    return `<div class="space-y-2 ml-2 border-l-2 border-gray-700 pl-3">
                        ${Object.entries(val).map(([k, v]) => `
                            <div>
                                <span class="font-semibold text-gray-400 capitalize">${k.replace(/_/g, ' ')}:</span>
                                <span class="text-gray-300">${formatResearchValue(v)}</span>
                            </div>
                        `).join('')}
                    </div>`;
                }
                return String(val);
            }

            let html = '<div class="space-y-4">';
            for (const [key, value] of Object.entries(researchData)) {
                html += `
                    <div class="bg-gray-800/50 rounded-lg p-4">
                        <h4 class="text-sm font-semibold text-violet-400 uppercase mb-2">${key.replace(/_/g, ' ')}</h4>
                        <div class="text-sm text-gray-300">${formatResearchValue(value)}</div>
                    </div>`;
            }
            html += '</div>';

            contentShowTextModal('Research Data', '');
            // Replace the modal body content with research HTML
            const modal = document.getElementById('contentDetailModal');
            const body = modal.querySelector('.overflow-y-auto');
            if (body) body.innerHTML = html;
        }

        async function contentLoadWebflowSites() {
            const apiKey = document.getElementById('contentWfApiKey').value.trim();
            if (!apiKey) return alert('Please enter API Key');
            localStorage.setItem('wf_api_key', apiKey);

            const btn = document.getElementById('contentWfLoadBtn');
            btn.innerText = 'Loading...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/webflow/sites', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: apiKey })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                if (data.sites && data.sites.length > 0) {
                    const select = document.getElementById('contentWfSiteSelect');
                    select.innerHTML = '<option value="">Select a site...</option>';
                    data.sites.forEach(site => {
                        const name = site.displayName || site.name || 'Untitled Site';
                        select.innerHTML += `<option value="${site.id}">${name}</option>`;
                    });
                    document.getElementById('contentWfSiteSection').classList.remove('hidden');
                } else {
                    alert('No sites found. Check your API Key.');
                }
            } catch (e) {
                console.error(e);
                alert(e.message);
            } finally {
                btn.innerText = 'Load Sites';
                btn.disabled = false;
            }
        }

        async function startAudit2() {
            const domain = document.getElementById('audit2Domain').value.trim();
            const maxPages = document.getElementById('audit2PageCount').value;
            const statusEl = document.getElementById('audit2Status');
            const btn = document.getElementById('audit2StartBtn');

            if (!domain) { alert('Please enter a domain'); return; }

            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Starting...';
            lucide.createIcons();
            statusEl.classList.remove('hidden');
            statusEl.innerHTML = `<span class="text-cyan-400">⏳ Starting audit for ${domain}...</span>`;

            try {
                const res = await fetch('/api/site-audit/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain, max_pages: parseInt(maxPages) })
                });
                const data = await res.json();

                if (data.success) {
                    statusEl.innerHTML = `<span class="text-green-400">✅ Audit started: ${data.message}</span>`;
                    document.getElementById('audit2Domain').value = '';

                    if (data.audit_id && data.task_id) {
                        pollAudit2Status(data.audit_id, data.task_id);
                    }
                    setTimeout(() => loadAudit2List(), 1000);
                } else {
                    statusEl.innerHTML = `<span class="text-red-400">❌ ${data.error || 'Failed to start audit'}</span>`;
                }
            } catch (e) {
                statusEl.innerHTML = `<span class="text-red-400">❌ Error: ${e.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="play" class="w-4 h-4"></i> Run Audit';
                lucide.createIcons();
            }
        }

        function pollAudit2Status(auditId, taskId) {
            if (audit2Polls[auditId]) clearInterval(audit2Polls[auditId]);

            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/site-audit/status/${taskId}`);
                    const data = await res.json();

                    if (data.ready || data.crawl_status === 'finished') {
                        clearInterval(interval);
                        delete audit2Polls[auditId];

                        await fetch('/api/site-audit/save-results', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ audit_id: auditId, task_id: taskId })
                        });

                        loadAudit2List();
                    }
                } catch (e) {
                    console.warn('[audit2] Poll error:', e);
                }
            }, 10000);

            audit2Polls[auditId] = interval;
        }

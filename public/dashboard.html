<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgencyOS | SEO Agency Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            900: '#111827',
                            950: '#0B0F19',
                        },
                        violet: {
                            500: '#8B5CF6',
                            600: '#7C3AED',
                        },
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

        html {
            font-size: 13px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0B0F19;
        }

        .top-tab {
            padding: 0.5rem 1rem;
            border-bottom: 2px solid transparent;
        }

        .top-tab.active {
            border-bottom-color: #8B5CF6;
            color: white;
        }

        .top-tab:hover {
            color: white;
        }

        .side-tab {
            padding: 0.5rem 0.75rem;
            border-left: 2px solid transparent;
        }

        .side-tab.active {
            border-left-color: #8B5CF6;
            background: rgba(139, 92, 246, 0.1);
            color: white;
        }

        .side-tab:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0B0F19;
        }

        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.15s ease-out forwards;
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- Top Header Bar -->
    <header class="bg-gray-900 border-b border-gray-800 shrink-0 relative z-50">
        <div class="flex items-center justify-between px-4 h-12">
            <!-- Logo -->
            <div class="flex items-center gap-2">
                <div class="bg-gradient-to-r from-violet-600 to-indigo-600 p-1.5 rounded-lg">
                    <i data-lucide="brain-circuit" class="w-4 h-4 text-white"></i>
                </div>
                <span class="text-sm font-bold text-white">Agency<span class="text-violet-500">OS</span></span>
            </div>

            <!-- Top Tabs -->
            <nav class="flex items-center gap-1" id="topTabs">
                <!-- Populated by JS -->
            </nav>

            <!-- Right Side: Client Selector + New Client -->
            <div class="flex items-center gap-3">
                <select id="clientSelector" onchange="selectClient(this.value)"
                    class="bg-gray-800 border border-gray-700 text-white text-sm rounded-lg px-3 py-1.5 focus:border-violet-500 focus:outline-none min-w-[200px] pointer-events-none appearance-none">
                    <option value="">Select Client...</option>
                </select>
                <button onclick="showNewClientModal()"
                    class="bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    New Client
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Left Sidebar (Side Tabs) -->
        <aside class="w-48 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
            <div class="p-3 border-b border-gray-800">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider" id="sidebarTitle">Navigation</p>
            </div>
            <nav class="flex-1 p-2 space-y-1 overflow-y-auto" id="sideTabs">
                <!-- Populated by JS -->
            </nav>

            <!-- User Info -->
            <div class="p-3 border-t border-gray-800">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-7 h-7 rounded-full bg-gradient-to-r from-violet-600 to-indigo-600 flex items-center justify-center text-white text-xs font-bold"
                        id="userAvatar">?</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-white truncate" id="userName">Loading...</p>
                        <p class="text-xs text-gray-400 truncate" id="userRole">--</p>
                    </div>
                </div>
                <div class="px-2 pb-3 pt-1 space-y-1">
                    <button onclick="showUserSettingsModal()"
                        class="w-full flex items-center justify-center gap-1.5 px-2 py-1.5 text-xs text-gray-400 hover:text-white hover:bg-gray-800 rounded transition-colors">
                        <i data-lucide="settings" class="w-3 h-3"></i> Settings
                    </button>
                    <button onclick="logout()"
                        class="w-full flex items-center justify-center gap-1.5 px-2 py-1.5 text-xs text-gray-400 hover:text-red-400 hover:bg-gray-800 rounded transition-colors">
                        <i data-lucide="log-out" class="w-3 h-3"></i> Logout
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Content Header -->
            <div class="h-12 bg-gray-900/50 border-b border-gray-800 flex items-center justify-between px-6 shrink-0">
                <h1 class="text-base font-semibold text-white" id="pageTitle">Dashboard</h1>
                <div class="flex items-center gap-2" id="pageActions">
                    <!-- Actions populated by JS -->
                </div>
            </div>

            <!-- Content -->
            <div class="flex-1 overflow-y-auto p-6" id="contentArea">
                <div class="flex items-center justify-center h-full text-gray-500">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin mr-2"></i> Loading...
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50">
        <div id="modalContent"
            class="bg-gray-900 border border-gray-700 rounded-xl w-full max-w-lg shadow-2xl animate-fade-in">
        </div>
    </div>

        /** Render <option> tags for a country dropdown. selectedCode = current value to pre-select */
        function renderCountryOptions(selectedCode) {
            const seen = new Set();
            return ALL_COUNTRIES.map(c => {
                if (seen.has(c.code)) return '';
                seen.add(c.code);
                const sel = (c.code === selectedCode) ? 'selected' : '';
                return `<option value="${c.code}" ${sel}>${c.name}</option>`;
            }).join('');
        }

        // =========================================================================
        // INIT
        // =========================================================================
        async function init() {
            try {
                const response = await fetch('/api/auth/me');
                if (!response.ok) {
                    window.location.href = '/login.html';
                    return;
                }

                const data = await response.json();
                currentUser = data.user;

                // Reset active audit on full reload
                activeAudit = null;

                // Update user info
                document.getElementById('userName').textContent = currentUser.full_name || currentUser.email.split('@')[0];
                document.getElementById('userRole').textContent = data.role_info?.name || currentUser.role;
                document.getElementById('userAvatar').textContent = (currentUser.full_name || currentUser.email)[0].toUpperCase();

                // Build UI
                buildTopTabs();
                buildSideTabs();
                await loadClients();
                loadContent();

                lucide.createIcons();
            } catch (error) {
                console.error('Init error:', error);
                window.location.href = '/login.html';
            }
        }

        // =========================================================================
        // BUILD UI
        // =========================================================================
        function buildTopTabs() {
            const container = document.getElementById('topTabs');
            // Filter out client-only tabs when no client is selected
            const visibleTabs = TOP_TABS.filter(tab => !tab.clientOnly || currentClient);
            container.innerHTML = visibleTabs.map(tab => `
                <button onclick="switchTopTab('${tab.id}')" 
                    class="top-tab flex items-center gap-1.5 text-sm text-gray-400 transition-colors ${tab.id === currentTopTab ? 'active' : ''}">
                    <i data-lucide="${tab.icon}" class="w-4 h-4"></i>
                    ${tab.label}
                </button>
            `).join('');
            lucide.createIcons();
        }

        function buildSideTabs() {
            const container = document.getElementById('sideTabs');
            const tabs = SIDE_TABS[currentTopTab] || [];
            const titleMap = {
                'dashboard': 'Dashboard',
                'tech-audit': 'Tech Issues',
                'audit-2': 'Site Audit',
                'content': 'Content',
                'keywords': 'Keywords',
                'competitors': 'Competitors',
                'links': 'Links',
                'tasks': 'Tasks',
                'reports': 'Reports',
                'client-settings': 'Client Settings'
            };

            document.getElementById('sidebarTitle').textContent = titleMap[currentTopTab] || 'Navigation';

            container.innerHTML = tabs.map(tab => `
                <button onclick="switchSideTab('${tab.id}')" 
                    class="side-tab w-full text-left text-sm text-gray-400 rounded transition-colors ${tab.id === currentSideTab ? 'active' : ''}">
                    ${tab.label}
                </button>
            `).join('');
        }

        // =========================================================================
        // NAVIGATION
        // =========================================================================
        function switchTopTab(tabId) {
            currentTopTab = tabId;
            currentSideTab = SIDE_TABS[tabId]?.[0]?.id || 'overview';
            buildTopTabs();
            buildSideTabs();
            loadContent();
        }

        function switchSideTab(tabId) {
            currentSideTab = tabId;
            buildSideTabs();
            loadContent();
        }

        function selectSideTab(topTabId, sideTabId) {
            currentTopTab = topTabId;
            currentSideTab = sideTabId;
            buildTopTabs();
            buildSideTabs();
            loadContent();
        }

        // =========================================================================
        // CLIENT SELECTOR
        // =========================================================================
        async function loadClients() {
            try {
                const response = await fetch('/api/campaigns');
                const data = await response.json();
                clients = data.campaigns || [];

                const selector = document.getElementById('clientSelector');
                selector.innerHTML = '<option value="">Select Client...</option>' +
                    clients.map(c => `<option value="${c.id}">${c.name} (${c.domain})</option>`).join('');

                // Restore selected client from URL
                const params = new URLSearchParams(window.location.search);
                const clientId = params.get('client');
                if (clientId) {
                    selector.value = clientId;
                    currentClient = clients.find(c => c.id === clientId);
                    // Rebuild tabs to show client-only tabs (like Settings)
                    buildTopTabs();
                }
            } catch (error) {
                console.error('Error loading clients:', error);
            }
        }

        function selectClient(clientId, skipReload = false) {
            currentClient = clients.find(c => c.id === clientId) || null;
            
            // Update the display indicator
            const selector = document.getElementById('clientSelector');
            if (selector) {
                selector.value = clientId || '';
            }

            // Update URL
            const url = new URL(window.location);
            if (clientId) {
                url.searchParams.set('client', clientId);
            } else {
                url.searchParams.delete('client');
            }
            window.history.pushState({}, '', url);

            // Only reload if not being chained with another navigation action
            if (!skipReload) {
                loadContent();
            }
        }

        // =========================================================================
        // CONTENT LOADING
        // =========================================================================
        async function loadContent() {
            const contentArea = document.getElementById('contentArea');
            const pageTitle = document.getElementById('pageTitle');
            const pageActions = document.getElementById('pageActions');

            // Show loading
            contentArea.innerHTML = `<div class="flex items-center justify-center h-32 text-gray-500">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin mr-2"></i> Loading...
            </div>`;
            lucide.createIcons();

            // Set title
            const tab = TOP_TABS.find(t => t.id === currentTopTab);
            const sideTab = SIDE_TABS[currentTopTab]?.find(t => t.id === currentSideTab);
            pageTitle.textContent = sideTab?.label || tab?.label || 'Dashboard';

            // Load based on current tab
            if (currentTopTab === 'dashboard') {
                await loadDashboardContent();
            } else if (currentTopTab === 'audit-2') {
                await loadAudit2Content();
            } else if (!currentClient) {
                contentArea.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-gray-500">
                        <i data-lucide="folder-open" class="w-12 h-12 mb-4 text-gray-600"></i>
                        <p class="text-lg font-medium">Select a project to view data</p>
                        <p class="text-sm mt-1">Please select a project from the Dashboard tab</p>
                    </div>`;
                pageActions.innerHTML = '';
            } else {
                await loadTabContent();
            }

            lucide.createIcons();
        }

        async function loadDashboardContent() {
            const contentArea = document.getElementById('contentArea');
            const pageActions = document.getElementById('pageActions');

            if (currentSideTab === 'overview') {
                pageActions.innerHTML = '';

                try {
                    let tasksUrl = '/api/tasks';
                    if (currentClient && currentClient.id) {
                        tasksUrl += `?campaign_id=${currentClient.id}`;
                    }

                    const [campaignsRes, tasksRes] = await Promise.all([
                        fetch('/api/campaigns'),
                        fetch(tasksUrl)
                    ]);
                    const campaigns = await campaignsRes.json().then(data => data.campaigns || []);
                    const tasks = await tasksRes.json().then(data => data.tasks || []);

                    const stats = {
                        clients: campaigns.length,
                        pending: tasks.filter(t => t.status === 'pending').length,
                        inProgress: tasks.filter(t => t.status === 'in_progress').length,
                        completed: tasks.filter(t => t.status === 'done').length
                    };

                    contentArea.innerHTML = `
                        <div class="grid grid-cols-4 gap-4 mb-6">

        // =====================================================================
        // Analytics Dashboard — store fetched data globally for sub-tab switching
        // =====================================================================
        let _analyticsData = null;
        let _analyticsTemplate = localStorage.getItem('analytics_template') || 'gsc';
        let _analyticsDuration = localStorage.getItem('analytics_duration') || '1m';
        let _analyticsView = 'overview';

        // =====================================================================
        // PREMIUM ANALYTICS DASHBOARD — HELPERS
        // =====================================================================
        function fmtK(n) {
            if (n === null || n === undefined) return '0';
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
            return new Intl.NumberFormat('en-US').format(n);
        }
        function fmtNum(n) {
            return new Intl.NumberFormat('en-US').format(n || 0);
        }
        function pctChange(curr, prev) {
            if (!prev || prev === 0) return null;
            return ((curr - prev) / prev * 100);
        }
        function changeBadgeHtml(curr, prev, invert = false) {
            const pct = pctChange(curr, prev);
            if (pct === null) return '<span class="text-xs text-gray-600">N/A</span>';
            const isPositive = pct >= 0;
            const isGood = invert ? !isPositive : isPositive;
            const arrow = isPositive ? '▲' : '▼';
            const color = isGood ? 'text-emerald-400' : 'text-red-400';
            return '<span class="text-xs font-medium ' + color + '">' + arrow + ' ' + Math.abs(pct).toFixed(1) + '%</span>';
        }
        function formatDuration(seconds) {
            if (!seconds) return '00:00:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }

        function initPremiumCharts(gsc, ga4, tpl, ac, acRgb) {
            const chartFont = { family: "'Inter','system-ui',sans-serif", size: 10 };
            const gridColor = 'rgba(255,255,255,0.04)';
            const tickColor = '#6b7280';

            // ---- LINE CHART ----
            const lineEl = document.getElementById('premiumLineChart');
            if (lineEl) {
                const ctx = lineEl.getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, 0, lineEl.height * 2);
                gradient.addColorStop(0, 'rgba('+acRgb+',0.25)');
                gradient.addColorStop(1, 'rgba('+acRgb+',0)');

                let labels, dataCurr, dataPrev;
                if (tpl === 'gsc') {
                    labels = (gsc.timeseries||[]).map(r => { const d = new Date(r.date); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); });
                    dataCurr = (gsc.timeseries||[]).map(r => r.impressions);
                    dataPrev = (gsc.prevTimeseries||[]).map(r => r.impressions);
                } else {
                    labels = (ga4.timeseries||[]).map(r => { const d = new Date(r.date); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); });
                    dataCurr = (ga4.timeseries||[]).map(r => r.sessions);
                    dataPrev = (ga4.prevTimeseries||[]).map(r => r.sessions);
                }
                if (window.premiumLineChartInstance) window.premiumLineChartInstance.destroy();
                window.premiumLineChartInstance = new Chart(lineEl, {
                    type: 'line',
                    data: { labels, datasets: [
                        { label: tpl==='gsc'?'Impressions':'Sessions', data: dataCurr, borderColor: ac, backgroundColor: gradient, fill: true, tension: 0.35, borderWidth: 2, pointRadius: 2, pointBackgroundColor: ac, pointBorderColor: ac, pointHoverRadius: 5 },
                        { label: 'Previous ' + (_analyticsData && _analyticsData.meta && _analyticsData.meta.duration_days ? _analyticsData.meta.duration_days + 'd' : ''), data: dataPrev, borderColor: '#4b5563', borderDash: [5,5], fill: false, tension: 0.35, borderWidth: 1.5, pointRadius: 0 }
                    ]},
                    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false, backgroundColor: '#1f2937', titleColor: '#e5e7eb', bodyColor: '#9ca3af', borderColor: '#374151', borderWidth: 1 } }, scales: { x: { grid: { color: gridColor }, ticks: { color: tickColor, font: chartFont, maxTicksLimit: 10 } }, y: { grid: { color: gridColor }, ticks: { color: tickColor, font: chartFont, callback: v => fmtK(v) } } }, interaction: { mode: 'nearest', axis: 'x', intersect: false } }
                });
            }

            // ---- DONUT CHART ----
            const donutEl = document.getElementById('premiumDonut');
            if (donutEl) {
                const devColors = { 'DESKTOP': '#6366f1', 'desktop': '#6366f1', 'MOBILE': ac, 'mobile': ac, 'TABLET': '#f59e0b', 'tablet': '#f59e0b' };
                let devData, devLabels, devMetric;
                if (tpl === 'gsc') {
                    devLabels = (gsc.devices||[]).map(d => d.device);
                    devData = (gsc.devices||[]).map(d => d.impressions);
                    devMetric = 'impressions';
                } else {
                    devLabels = (ga4.devices||[]).map(d => d.device);
                    devData = (ga4.devices||[]).map(d => d.sessions);
                    devMetric = 'sessions';
                }
                if (window.premiumDonutInstance) window.premiumDonutInstance.destroy();
                window.premiumDonutInstance = new Chart(donutEl, {
                    type: 'doughnut',
                    data: { labels: devLabels, datasets: [{ data: devData, backgroundColor: devLabels.map(l => devColors[l]||'#8b5cf6'), borderWidth: 0, hoverBorderWidth: 2, hoverBorderColor: '#fff' }] },
                    options: { responsive: true, maintainAspectRatio: true, cutout: '68%', plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1f2937', titleColor: '#e5e7eb', bodyColor: '#9ca3af' } } }
                });
                const legendEl = document.getElementById('premiumDonutLegend');
                if (legendEl) {
                    const total = devData.reduce((a,b)=>a+b,0);
                    const devices = tpl === 'gsc' ? (gsc.devices||[]) : (ga4.devices||[]);
                    legendEl.innerHTML = devices.map(d => {
                        const val = tpl==='gsc' ? d.impressions : d.sessions;
                        const pct = total > 0 ? ((val/total)*100).toFixed(1) : '0';
                        const color = devColors[d.device] || '#8b5cf6';
                        const label = (d.device||'').charAt(0).toUpperCase() + (d.device||'').slice(1).toLowerCase();
                        return '<div class="mb-3"><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm" style="background:'+color+'"></span><span class="text-xs text-gray-400 uppercase">'+label+'</span></div><div class="text-xl font-bold text-white">'+fmtK(val)+'</div><div class="text-xs" style="color:'+color+'">'+pct+'%</div></div>';
                    }).join('');
                }
            }

            // ---- CHANNEL DONUT (GA4 overview) ----
            const chDonutEl = document.getElementById('premiumChannelDonut');
            if (chDonutEl && ga4.channels) {
                const chColors = [ac, '#6366f1', '#10b981', '#ef4444', '#f59e0b', '#8b5cf6', '#14b8a6', '#ec4899'];
                const chLabels = (ga4.channels||[]).slice(0,6).map(c => c.channel);
                const chData = (ga4.channels||[]).slice(0,6).map(c => c.sessions);
                if (window.premiumChDonutInstance) window.premiumChDonutInstance.destroy();
                window.premiumChDonutInstance = new Chart(chDonutEl, {
                    type: 'doughnut',
                    data: { labels: chLabels, datasets: [{ data: chData, backgroundColor: chColors.slice(0, chLabels.length), borderWidth: 0 }] },
                    options: { responsive: true, maintainAspectRatio: true, cutout: '55%', plugins: { legend: { display: false } } }
                });
            }

            // ---- CHANNEL BAR CHART ----
            const chBarEl = document.getElementById('premiumChannelBar');
            if (chBarEl && ga4.channels) {
                const chColors2 = [ac, '#6366f1', '#10b981', '#ef4444', '#f59e0b', '#8b5cf6', '#14b8a6', '#ec4899'];
                if (window.premiumChBarInstance) window.premiumChBarInstance.destroy();
                window.premiumChBarInstance = new Chart(chBarEl, {
                    type: 'bar',
                    data: { labels: (ga4.channels||[]).map(c => c.channel), datasets: [{ label: 'Sessions', data: (ga4.channels||[]).map(c => c.sessions), backgroundColor: (ga4.channels||[]).map((_,i) => chColors2[i%chColors2.length]), borderRadius: 4, barThickness: 18 }] },
                    options: { responsive: true, maintainAspectRatio: true, indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1f2937' } }, scales: { x: { grid: { color: gridColor }, ticks: { color: tickColor, font: chartFont, callback: v => fmtK(v) } }, y: { grid: { display: false }, ticks: { color: '#d1d5db', font: { ...chartFont, size: 11 } } } } }
                });
            }
        }

        async function saveClientSettings() {
            if (!currentClient) return;

            // Collect all settings from current page
            const settings = { ...currentClient.settings };

            // General
            const name = document.getElementById('setting_name');
            const domain = document.getElementById('setting_domain');
            const language = document.getElementById('setting_language');
            const location = document.getElementById('setting_location');

            if (language) settings.language = language.value;
            if (location) settings.location = location.value;

            // Google
            const gscProperty = document.getElementById('setting_gsc_property');
            const ga4Property = document.getElementById('setting_ga4_property');
            if (gscProperty) settings.gsc_property = gscProperty.value;
            if (ga4Property) settings.ga4_property = ga4Property.value;

            // CMS
            const wpUrl = document.getElementById('setting_wp_url');
            const wpUser = document.getElementById('setting_wp_user');
            const wpAppPassword = document.getElementById('setting_wp_app_password');
            const shopifyStore = document.getElementById('setting_shopify_store');
            const shopifyToken = document.getElementById('setting_shopify_token');
            if (wpUrl) settings.wp_url = wpUrl.value;
            if (wpUser) settings.wp_user = wpUser.value;
            if (wpAppPassword) settings.wp_app_password = wpAppPassword.value;
            if (shopifyStore) settings.shopify_store = shopifyStore.value;
            if (shopifyToken) settings.shopify_token = shopifyToken.value;

            // Analytics
            const clarityId = document.getElementById('setting_clarity_id');
            const ahrefsToken = document.getElementById('setting_ahrefs_token');
            if (clarityId) settings.clarity_id = clarityId.value;
            if (ahrefsToken) settings.ahrefs_token = ahrefsToken.value;

            // Competitors
            const competitorInputs = document.querySelectorAll('.competitor-input');
            if (competitorInputs.length) {
                settings.competitors = Array.from(competitorInputs).map(i => i.value).filter(v => v.trim());
            }

            // Prepare update data
            const updateData = { settings };
            if (name) updateData.name = name.value;
            if (domain) updateData.domain = domain.value;

            try {
                const res = await fetch(`/api/campaigns/${currentClient.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                if (res.ok) {
                    const { campaign } = await res.json();
                    // Update local state
                    currentClient = campaign;
                    const idx = clients.findIndex(c => c.id === campaign.id);
                    if (idx >= 0) clients[idx] = campaign;

                    showModal(`
                    <div class="p-6 text-center">
                            <div class="w-12 h-12 mx-auto mb-4 bg-emerald-500/20 rounded-full flex items-center justify-center">
                                <i data-lucide="check" class="w-6 h-6 text-emerald-400"></i>
                            </div>
                            <h3 class="text-lg font-semibold text-white mb-2">Settings Saved</h3>
                            <p class="text-gray-400 text-sm mb-4">Client settings have been updated.</p>
                            <button onclick="hideModal()" class="bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded-lg text-sm font-medium">OK</button>
                        </div>
                    `);
                    lucide.createIcons();
                } else {
                    const err = await res.json();
                    alert(err.error || 'Failed to save settings');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function changePassword(e) {
            e.preventDefault();
            const form = e.target;
            const current_password = form.current_password.value;
            const new_password = form.new_password.value;
            const confirm_password = form.confirm_password.value;

            if (new_password !== confirm_password) {
                alert("New passwords do not match");
                return;
            }

            const btn = form.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Updating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password, new_password })
                });

                const data = await res.json();

                if (res.ok) {
                    showModal(`

                                <div class="w-12 h-12 mx-auto mb-4 bg-emerald-500/20 rounded-full flex items-center justify-center">

                                <button onclick="hideModal()" class="bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded-lg text-sm font-medium">OK</button>
                            </div>
                    `);
                    lucide.createIcons();
                } else {
                    alert('Error: ' + data.error);
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert('Error: ' + error.message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function runAudit(isCompetitor = false, competitorDomain = null, maxPages = 200) {
            if (!confirm(isCompetitor ? 'Start a comprehensive technical audit for this competitor?' : 'Start a new comprehensive technical audit? This usually takes a few minutes depending on page count.')) return;

            const btn = event.currentTarget || document.querySelector('button[onclick*="runAudit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Starting...`;
            btn.disabled = true;

            // Show loading state immediately based on view
            if (!isCompetitor) {
                loadAuditContent();
            } else {
                loadCompetitorContent();
            }

            try {
                const payload = {
                    campaign_id: currentClient.id,
                    max_pages: maxPages
                };
                if (isCompetitor && competitorDomain) {
                    payload.type = 'competitor';
                    payload.competitor_domain = competitorDomain;
                } else {
                    payload.type = 'technical';
                }

                const response = await fetch('/api/audits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Failed to start audit');

                if (!isCompetitor) {
                    await loadAuditContent();
                } else {
                    await loadCompetitorContent();
                }
            } catch (error) {
                alert('Error: ' + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function checkAuditStatus(auditId) {
            try {
                const response = await fetch(`/api/audits/${auditId}`);
                const data = await response.json();

                if (data.audit && data.audit.status === 'completed') {
                    // It finished! Reload list to show "View Results"
                    await loadAuditContent();
                } else {
                    // Still running, maybe show a toast
                    const btn = document.querySelector(`button[onclick="checkAuditStatus('${auditId}')"]`);
                    if (btn) {
                        const original = btn.innerHTML;
                        btn.innerHTML = `<i data-lucide="check" class="w-3 h-3 text-emerald-400"></i> Still running...`;
                        setTimeout(() => btn.innerHTML = original, 2000);
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function viewAuditResults(auditId) {
            try {
                // Show loading state
                const btn = document.querySelector(`button[onclick="viewAuditResults('${auditId}')"]`);
                if (btn) btn.innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> Loading...`;

                const response = await fetch(`/api/audits/${auditId}`);
                const data = await response.json();

                if (data.audit) {
                    activeAudit = data.audit;
                    loadContent();
                }
            } catch (e) {
                console.error(e);
                alert('Failed to load audit results');
            }
        }

            setTimeout(() => updateProgress(20, 'Running PageSpeed & readability analysis...'), 2000);

            setTimeout(() => updateProgress(60, 'Capturing screenshots...'), 10000);

            const iframe = document.createElement('iframe');

            iframe.src = `/audit-dashboard.html?audit_id=${auditId}&auto_generate=true&template_type=${templateType}`;
            iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1400px;height:900px;opacity:0;pointer-events:none;';
            document.body.appendChild(iframe);

            // Listen for postMessage from iframe
            const messageHandler = (event) => {
                if (event.data?.type === 'slides-ready') {
                    window.removeEventListener('message', messageHandler);

                    updateProgress(100, 'Presentation ready!');

                    // Save the slides_url to the audit record
                    fetch(`/ api / audits / ${auditId}/slides-url`, {

                        const modalEl = document.getElementById('slideGenModal');
                        if (modalEl) {

                                        <a href="${event.data.presentation_url}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-lg font-medium flex items-center gap-2">
                                            <i data-lucide="external-link" class="w-4 h-4"></i> Open Presentation
                                        </a>
                                        <button onclick="document.getElementById('slideGenModal').remove()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2.5 rounded-lg font-medium border border-gray-700">
                                            Close
                                        </button>
                                    </div>
                                </div>
                            `;
                            lucide.createIcons();
                        }
                    }, 1000);

                } else if (event.data?.type === 'slides-error') {
                    window.removeEventListener('message', messageHandler);

                    const iframeEl = document.getElementById('slideGenIframe');
                    if (iframeEl) iframeEl.remove();

                    const modalEl = document.getElementById('slideGenModal');
                    if (modalEl) {
                        modalEl.innerHTML = `
                            <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 max-w-md w-full mx-4 shadow-2xl text-center">
                                <div class="text-5xl mb-4">❌</div>

                                    Close
                                </button>
                            </div>
                        `;
                    }
                }
            };
            window.addEventListener('message', messageHandler);

            // Timeout after 3 minutes
            setTimeout(() => {
                const iframeEl = document.getElementById('slideGenIframe');
                if (iframeEl) {
                    iframeEl.remove();
                    window.removeEventListener('message', messageHandler);

                    const modalEl = document.getElementById('slideGenModal');
                    if (modalEl) {
                        modalEl.innerHTML = `
                            <div class="bg-gray-900 border border-gray-800 rounded-xl p-8 max-w-md w-full mx-4 shadow-2xl text-center">

                                    Close
                                </button>
                            </div>
                        `;
                    }

        async function runCompetitorAnalysis() {
            const inputs = document.querySelectorAll('.competitor-input');
            const competitors = Array.from(inputs).map(i => i.value.trim()).filter(v => v);

            if (competitors.length === 0) {
                alert('Please enter at least one competitor domain.');
                return;
            }

            const btn = document.querySelector('button[onclick="runCompetitorAnalysis()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Analyzing...`;
            btn.disabled = true;

            try {
                const response = await fetch('/api/competitors/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        campaign_id: currentClient.id,
                        competitors: competitors
                    })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Analysis failed');

                // Reload client data to get updated settings
                const clientRes = await fetch(`/api/campaigns/${currentClient.id}`);
                const clientData = await clientRes.json();
                currentClient = clientData.campaign;

                // Refresh content
                await loadCompetitorContent();

            } catch (error) {
                alert('Error: ' + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function updateTaskStatus(taskId, newStatus) {
            try {
                const res = await fetch(`/api/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || 'Failed to update status on server');
                }

                // Update local state and trigger re-render
                const taskIndex = currentLoadedTasks.findIndex(t => t.id === taskId);
                if (taskIndex !== -1) {
                    currentLoadedTasks[taskIndex].status = newStatus;
                }
                window.renderTasksTable();

            } catch (e) {
                console.error(e);
                alert('Task update failed: ' + e.message);
                window.renderTasksTable();
            }
        }

        // --- Helpers ---
        function safeStr(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\"/g, '&quot;')
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '');
        }

        function contentShowLoading(message) {
            const overlay = document.getElementById('contentLoadingOverlay');
            if (!overlay) return;
            overlay.querySelector('span').innerText = message || 'Processing...';
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            const overlay = document.getElementById('contentLoadingOverlay');
            if (!overlay) return;
            overlay.classList.add('hidden');

        function renderMarkdown(text) {
            if (!text) return '';
            let html = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/^### (.*$)/gm, '<h5 class="font-bold text-gray-200 mt-3 mb-1">$1</h5>')
                .replace(/^## (.*$)/gm, '<h4 class="font-bold text-white mt-4 mb-2">$1</h4>')
                .replace(/^\s*[\*\-]\s+(.*$)/gm, '<li class="ml-4">$1</li>')
                .replace(/\n/g, '<br>');
            if (html.includes('<li')) {
                html = html.replace(/((?:<li.*?>.*?<\/li>\s*)+)/g, '<ul class="list-disc list-inside space-y-1 text-gray-300">$1</ul>');
            }
            return html;
        }

        async function assignPageType(url, pageType, encoding) {
            if (!pageType) return;
            if (!currentClient || !currentClient.id) return;
            
            try {
                const parsedData = JSON.parse(decodeURIComponent(atob(encoding)));
                let techData = {
                    title: parsedData.title || '',
                    meta_description: parsedData.description || parsedData.meta?.description || '',
                    word_count: parsedData.word_count || 0,
                    body_content: ""
                };

                const res = await fetch('/api/assign-page-type', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: currentClient.id,
                        url: url,
                        page_type: pageType,
                        tech_audit_data: techData
                    })
                });
                
                const response = await res.json();
                if (response.success) {
                    // Show a quick toast or let UI just refresh natively
                    const toast = document.createElement('div');
                    toast.className = 'fixed bottom-4 right-4 bg-green-600 text-white px-6 py-3 rounded shadow-lg z-50 text-sm font-medium';
                    toast.innerText = 'Page assigned to ' + pageType.toUpperCase();
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 3000);
                    
                    // Reload data in background to update tags
                    await loadContentPages();
                    renderAllLinks();
                } else {
                    alert('Error: ' + response.error);
                }
            } catch (e) {
                console.error(e);
                alert('Something went wrong assigning page type');
            }
        }

                            </div>
                        </td>
                    </tr>`;

                htmlContent += groupTopics.map(t => {
                    const data = t.tech_audit_data || {};
                    const contentPreview = t.content ? t.content.substring(0, 30) + '...' : '';
                    return `
                        <tr class="hover:bg-gray-800/30 transition-colors border-b border-gray-800/50">

        // --- Action Handlers ---
        async function handleBoFuAction(pageId, action, selectElement) {
            if (action === 'Idle') return;
            try {
                if (action === 'Generate Content' || action === 'Generate MoFu') {
                    contentShowLoading('Processing... this may take more than 2 minutes');
                } else {
                    contentShowLoading(`Processing ${action}...`);
                }

                const apiAction = action === 'Generate Content' ? 'generate_content' : 'generate_mofu';

                const res = await fetch('/api/batch-update-pages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_ids: [pageId], action: apiAction })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Unknown error');

                // Poll for completion
                const pollInterval = setInterval(async () => {
                    try {
                        const statusRes = await fetch(`/api/get-page-status?page_id=${pageId}`);
                        if (statusRes.ok) {
                            const statusData = await statusRes.json();
                            if (statusData.product_action && !statusData.product_action.includes('Processing')) {
                                clearInterval(pollInterval);
                                contentHideLoading();
                                await loadContentTab();
                                alert(`Success! ${action} completed.`);
                            }
                        }
                    } catch (e) { console.error('Polling error:', e); }
                }, 3000);

            } catch (e) {
                console.error(e);
                alert('Error: ' + e.message);
                contentHideLoading();
            } finally {
                if (selectElement) selectElement.value = 'Idle';
            }
        }

        async function handleMoFuAction(pageId, action) {
            if (action === 'Idle') return;

            if (action === 'PushWebflow') {
                currentArticlePageId = pageId;
                contentOpenWebflowModal();
                return;
            }
            if (action === 'PushWordpress') {
                currentArticlePageId = pageId;
                contentOpenWordpressModal();
                return;
            }
            if (action === 'CopyHTML') {
                await contentCopyHTML(pageId);
                return;
            }
            if (action === 'Generate Image') {
                await contentGenerateImage(pageId);
                return;
            }

            if (action === 'Conduct Research') {
                contentShowLoading('Conducting Deep Research... This may take up to 2 minutes per topic.');
            } else {
                contentShowLoading(`Processing ${action}... this may take more than 2 minutes`);
            }

            try {
                const apiAction = action === 'Generate Content' ? 'generate_content' :
                    action === 'Conduct Research' ? 'conduct_research' :
                    action === 'Generate ToFu' ? 'generate_tofu' : 'idle';

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 600000);

                const res = await fetch('/api/batch-update-pages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_ids: [pageId], action: apiAction }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(`API Error: ${res.status} - ${err}`);
                }

                // Poll for completion
                const pollInterval = setInterval(async () => {
                    try {
                        const statusRes = await fetch(`/api/get-page-status?page_id=${pageId}`);
                        if (statusRes.ok) {
                            const statusData = await statusRes.json();
                            if (statusData.product_action && !statusData.product_action.includes('Processing')) {
                                clearInterval(pollInterval);
                                contentHideLoading();
                                await loadContentTab();
                            }
                        }
                    } catch (e) { console.error('Polling error:', e); }
                }, 3000);

            } catch (e) {
                console.error(e);
                if (e.name === 'AbortError') {
                    alert('Action timed out. It may still be running in background. Refresh in a few minutes.');
                } else {
                    alert('Action failed: ' + e.message);
                }
                contentHideLoading();
            }
        }

        // --- Content Helper Functions ---
        async function contentDeletePage(id) {
            if (!confirm('Are you sure you want to delete this item? This cannot be undone.')) return;
            try {
                contentShowLoading('Deleting item...');
                const res = await fetch(`/api/delete-page?page_id=${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
                alert('Item deleted successfully.');
                await loadContentTab();
            } catch (e) {
                console.error(e);
                alert('Error deleting item: ' + e.message);
            } finally {
                contentHideLoading();
            }
        }

        async function contentCopyHTML(pageId) {
            contentShowLoading('Preparing HTML...');
            try {
                const res = await fetch('/api/get-html-content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_id: pageId })
                });
                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();
                await navigator.clipboard.writeText(data.html);
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-[9999] animate-pulse';
                toast.innerHTML = '<strong>✓ HTML Copied!</strong> Paste into WordPress or any CMS.';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            } catch (e) {
                console.error(e);
                alert('Error copying HTML: ' + e.message);
            } finally {
                contentHideLoading();
            }
        }

            if (!confirm('Generate AI image for this article? This will use 1 credit.')) return;

                const res = await fetch('/api/generate-blog-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_id: pageId })
                });

            } catch (e) {

                alert('Error generating image: ' + e.message);

                contentHideLoading();

        function contentShowResearchData(pageId) {
            const p = contentProjectPages.find(page => page.id === pageId);
            if (!p || !p.research_data) {
                alert('No research data available for this topic.');
                return;
            }

            const researchData = p.research_data;
            function formatResearchValue(val) {
                if (!val) return 'N/A';
                if (typeof val === 'string') return renderMarkdown(val);
                if (Array.isArray(val)) {
                    return `<ul class="list-disc list-inside space-y-1 ml-2">
                        ${val.map(item => `<li>${formatResearchValue(item)}</li>`).join('')}
                    </ul>`;
                }
                if (typeof val === 'object') {
                    return `<div class="space-y-2 ml-2 border-l-2 border-gray-700 pl-3">
                        ${Object.entries(val).map(([k, v]) => `
                            <div>
                                <span class="font-semibold text-gray-400 capitalize">${k.replace(/_/g, ' ')}:</span>
                                <span class="text-gray-300">${formatResearchValue(v)}</span>
                            </div>
                        `).join('')}
                    </div>`;
                }
                return String(val);
            }

            let html = '<div class="space-y-4">';
            for (const [key, value] of Object.entries(researchData)) {
                html += `
                    <div class="bg-gray-800/50 rounded-lg p-4">
                        <h4 class="text-sm font-semibold text-violet-400 uppercase mb-2">${key.replace(/_/g, ' ')}</h4>
                        <div class="text-sm text-gray-300">${formatResearchValue(value)}</div>
                    </div>`;
            }
            html += '</div>';

            contentShowTextModal('Research Data', '');
            // Replace the modal body content with research HTML
            const modal = document.getElementById('contentDetailModal');
            const body = modal.querySelector('.overflow-y-auto');
            if (body) body.innerHTML = html;
        }

        async function contentLoadWebflowSites() {
            const apiKey = document.getElementById('contentWfApiKey').value.trim();
            if (!apiKey) return alert('Please enter API Key');
            localStorage.setItem('wf_api_key', apiKey);

            const btn = document.getElementById('contentWfLoadBtn');
            btn.innerText = 'Loading...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/webflow/sites', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: apiKey })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                if (data.sites && data.sites.length > 0) {
                    const select = document.getElementById('contentWfSiteSelect');
                    select.innerHTML = '<option value="">Select a site...</option>';
                    data.sites.forEach(site => {
                        const name = site.displayName || site.name || 'Untitled Site';
                        select.innerHTML += `<option value="${site.id}">${name}</option>`;
                    });
                    document.getElementById('contentWfSiteSection').classList.remove('hidden');
                } else {
                    alert('No sites found. Check your API Key.');
                }
            } catch (e) {
                console.error(e);
                alert(e.message);
            } finally {
                btn.innerText = 'Load Sites';
                btn.disabled = false;
            }
        }

        async function contentLoadWebflowCollections() {
            const apiKey = localStorage.getItem('wf_api_key');
            const siteId = document.getElementById('contentWfSiteSelect').value;
            if (!siteId) return;

            try {
                const res = await fetch('/api/webflow/collections', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: apiKey, site_id: siteId })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                const select = document.getElementById('contentWfCollectionSelect');
                select.innerHTML = '<option value="">Select a collection...</option>';
                (data.collections || []).forEach(col => {
                    select.innerHTML += `<option value="${col.id}">${col.displayName || col.name}</option>`;
                });
                document.getElementById('contentWfCollectionSection').classList.remove('hidden');
            } catch (e) {
                console.error(e);
                alert(e.message);
            }
        }

        async function contentPublishToWebflow() {
            const apiKey = localStorage.getItem('wf_api_key');
            const collectionId = document.getElementById('contentWfCollectionSelect').value;
            if (!collectionId) return alert('Select a collection first');

            contentShowLoading('Publishing to Webflow...');
            try {
                const res = await fetch('/api/webflow/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        api_key: apiKey,
                        collection_id: collectionId,
                        page_id: currentArticlePageId
                    })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                alert('Published to Webflow successfully!');
                document.getElementById('contentWebflowModal').classList.add('hidden');
            } catch (e) {
                console.error(e);
                alert('Error publishing: ' + e.message);
            } finally {
                contentHideLoading();
            }
        }

        async function contentPublishToWordpress() {

            const wp_app_password = document.getElementById('contentWpAppPassword').value.trim();

            localStorage.setItem('wp_app_password', wp_app_password);
            
            contentShowLoading('Publishing to WordPress as Draft...');
            try {
                const res = await fetch('/api/publish-wordpress', {
                    method: 'POST',

                        page_id: currentArticlePageId,
                        wp_url: wp_url,
                        wp_username: wp_username,
                        wp_app_password: wp_app_password
                    })

                alert("Success! Draft posted to WordPress\\n\\nLink: " + (data.link || ""));
                document.getElementById('contentWpModal').classList.add('hidden');
            } catch (e) {
                console.error(e);
                alert("Error pushing to WordPress: " + e.message);
            } finally {
                contentHideLoading();
            }
        }

        let audit2Polls = {};

        async function loadAudit2Content() {
            const contentArea = document.getElementById('contentArea');
            const pageActions = document.getElementById('pageActions');
            pageActions.innerHTML = '';

            contentArea.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-6">
                    <!-- Header -->
                    <div class="flex items-center gap-3 mb-2">
                        <div class="p-2.5 bg-gradient-to-br from-cyan-500/20 to-blue-500/20 rounded-xl border border-cyan-500/20">

                        </div>
                        <div>

                            <p class="text-xs text-gray-400">Run a full technical audit on any domain — no project required</p>

                    <!-- Audit Form -->

                                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-colors" />
                            </div>
                            <div class="w-40">
                                <label class="block text-xs font-medium text-gray-400 mb-1.5">Max Pages</label>
                                <select id="audit2PageCount"
                                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none cursor-pointer">
                                    <option value="10">10 pages</option>
                                    <option value="25">25 pages</option>
                                    <option value="50" selected>50 pages</option>
                                    <option value="100">100 pages</option>
                                    <option value="200">200 pages</option>
                                    <option value="500">500 pages</option>
                                </select>
                            </div>
                            <button id="audit2StartBtn" onclick="startAudit2()"
                                class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2 transition-all shadow-lg shadow-cyan-500/10">
                                <i data-lucide="play" class="w-4 h-4"></i> Run Audit
                            </button>
                        </div>
                        <div id="audit2Status" class="mt-3 text-sm hidden"></div>
                    </div>

                    <!-- Recent Audits -->
                    <div class="bg-gray-900 border border-gray-800 rounded-xl">
                        <div class="px-6 py-4 border-b border-gray-800 flex items-center justify-between">
                            <h3 class="text-sm font-semibold text-white flex items-center gap-2">
                                <i data-lucide="history" class="w-4 h-4 text-gray-400"></i> Recent Audits
                            </h3>
                            <button onclick="loadAudit2List()" class="text-xs text-gray-400 hover:text-white transition-colors flex items-center gap-1">
                                <i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh
                            </button>
                        </div>
                        <div id="audit2List" class="divide-y divide-gray-800">
                            <div class="text-center text-gray-500 py-8 text-sm">Loading...</div>

            lucide.createIcons();

        async function startAudit2() {
            const domain = document.getElementById('audit2Domain').value.trim();
            const maxPages = document.getElementById('audit2PageCount').value;
            const statusEl = document.getElementById('audit2Status');
            const btn = document.getElementById('audit2StartBtn');

            if (!domain) { alert('Please enter a domain'); return; }

            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Starting...';
            lucide.createIcons();
            statusEl.classList.remove('hidden');
            statusEl.innerHTML = `<span class="text-cyan-400">⏳ Starting audit for ${domain}...</span>`;

            try {
                const res = await fetch('/api/site-audit/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain, max_pages: parseInt(maxPages) })
                });
                const data = await res.json();

                if (data.success) {
                    statusEl.innerHTML = `<span class="text-green-400">✅ Audit started: ${data.message}</span>`;
                    document.getElementById('audit2Domain').value = '';

                    if (data.audit_id && data.task_id) {
                        pollAudit2Status(data.audit_id, data.task_id);
                    }
                    setTimeout(() => loadAudit2List(), 1000);
                } else {
                    statusEl.innerHTML = `<span class="text-red-400">❌ ${data.error || 'Failed to start audit'}</span>`;
                }
            } catch (e) {
                statusEl.innerHTML = `<span class="text-red-400">❌ Error: ${e.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="play" class="w-4 h-4"></i> Run Audit';
                lucide.createIcons();
            }
        }

        function pollAudit2Status(auditId, taskId) {
            if (audit2Polls[auditId]) clearInterval(audit2Polls[auditId]);

            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/site-audit/status/${taskId}`);
                    const data = await res.json();

                    if (data.ready || data.crawl_status === 'finished') {
                        clearInterval(interval);
                        delete audit2Polls[auditId];

                        await fetch('/api/site-audit/save-results', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ audit_id: auditId, task_id: taskId })
                        });

                        loadAudit2List();
                    }
                } catch (e) {
                    console.warn('[audit2] Poll error:', e);
                }
            }, 10000);

            audit2Polls[auditId] = interval;
        }

        async function loadAudit2List() {
            const listEl = document.getElementById('audit2List');
            if (!listEl) return;
            listEl.innerHTML = '<div class="text-center text-gray-500 py-4 text-sm">Loading...</div>';

            try {
                const res = await fetch('/api/site-audit/list');
                const data = await res.json();
                const audits = data.audits || [];

                if (audits.length === 0) {
                    listEl.innerHTML = '<div class="text-center text-gray-500 py-8 text-sm">No audits yet. Start one above.</div>';
                    return;
                }

                listEl.innerHTML = audits.map(a => {
                    const statusBadge = a.status === 'completed'
                        ? '<span class="px-2 py-0.5 bg-green-500/20 text-green-400 rounded-full text-xs font-medium">Completed</span>'
                        : '<span class="px-2 py-0.5 bg-amber-500/20 text-amber-400 rounded-full text-xs font-medium animate-pulse">Crawling...</span>';

                    const date = new Date(a.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                    const slidesSection = a.status === 'completed' ? `
                        <div class="flex items-center gap-2">
                            <select id="tmpl-${a.id}" class="bg-gray-800 border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:border-cyan-500 outline-none">
                                <option value="authority_shift">4-Pillar Authority (19 slides)</option>
                            </select>
                            <button onclick="generateAudit2Slides('${a.id}')"
                                id="slides-btn-${a.id}"
                                class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 shadow-lg shadow-blue-500/10">
                                <i data-lucide="presentation" class="w-3.5 h-3.5"></i> Create Slides
                            </button>
                        </div>
                    ` : '';

                    if (a.status === 'crawling' && a.task_id) {
                        pollAudit2Status(a.id, a.task_id);
                    }

                    return `
                        <div class="px-6 py-4 flex items-center justify-between hover:bg-gray-800/30 transition-colors">
                            <div class="flex items-center gap-4">
                                <div class="p-2 bg-gray-800 rounded-lg">
                                    <i data-lucide="globe" class="w-4 h-4 text-cyan-400"></i>
                                </div>
                                <div>
                                    <p class="text-white text-sm font-medium">${a.domain}</p>
                                    <p class="text-gray-500 text-xs">${date} · ${a.max_pages} pages</p>
                                </div>
                                ${statusBadge}
                            </div>
                            <div class="flex items-center gap-3">
                                ${slidesSection}
                            </div>
                        </div>
                    `;
                }).join('');

                lucide.createIcons();
            } catch (e) {
                listEl.innerHTML = `<div class="text-center text-red-400 py-4 text-sm">Error: ${e.message}</div>`;
            }
        }

        async function generateAudit2Slides(auditId) {
            const templateType = document.getElementById(`tmpl-${auditId}`)?.value || 'authority_shift';
            const btn = document.getElementById(`slides-btn-${auditId}`);

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Generating...';
                lucide.createIcons();
            }

            // Use a hidden iframe to render audit-dashboard.html, capture screenshots, and generate slides
            const iframe = document.createElement('iframe');
            iframe.style.cssText = 'position:fixed;left:-9999px;top:0;width:1400px;height:900px;border:none;opacity:0;pointer-events:none;';
            iframe.src = `/audit-dashboard.html?audit_id=${auditId}&auto_generate=true&template_type=${templateType}`;
            document.body.appendChild(iframe);

            const timeout = setTimeout(() => {
                try { document.body.removeChild(iframe); } catch(e) {}
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="presentation" class="w-3.5 h-3.5"></i> Create Slides';
                    lucide.createIcons();
                }
                alert('Slide generation timed out. Please try again.');
            }, 300000);

            function handleMessage(event) {
                if (event.data?.type === 'slides-ready') {
                    clearTimeout(timeout);
                    window.removeEventListener('message', handleMessage);
                    try { document.body.removeChild(iframe); } catch(e) {}

                    if (event.data.presentation_url) {
                        window.open(event.data.presentation_url, '_blank');
                        loadAudit2List();
                    }

                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '<i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Done!';
                        lucide.createIcons();
                        setTimeout(() => {
                            btn.innerHTML = '<i data-lucide="presentation" class="w-3.5 h-3.5"></i> Create Slides';
                            lucide.createIcons();
                        }, 3000);
                    }
                } else if (event.data?.type === 'slides-error') {
                    clearTimeout(timeout);
                    window.removeEventListener('message', handleMessage);
                    try { document.body.removeChild(iframe); } catch(e) {}

                    const errMsg = event.data.error || 'Unknown error';
                    if (errMsg.includes('needs_auth') || errMsg.includes('Google')) {
                        if (confirm('Google sign-in required to create slides. Redirect now?')) {
                            window.location.href = '/oauth/start?return_path=/dashboard.html';
                        }
                    } else {
                        alert('Slide generation failed: ' + errMsg);
                    }

                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '<i data-lucide="presentation" class="w-3.5 h-3.5"></i> Create Slides';
                        lucide.createIcons();
                    }
                }
            }

            window.addEventListener('message', handleMessage);
        }
    </script>
